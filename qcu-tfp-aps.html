      </div>

      <div>
        <button class="start-btn" id="dlStart">
          Commencer · <span class="tnum">${dlCount==="max"?total:Math.min(dlCount,total)}</span> questions
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12h14M13 6l6 6-6 6"/></svg>
        </button>
        ${best.last!=null?`<div class="best" style="margin-top:12px"><svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 2l2.4 7.4H22l-6 4.6 2.3 7.4L12 17l-6.3 4.4L8 14 2 9.4h7.6z"/></svg> Meilleur score : <b class="tnum">&nbsp;${best.best}%</b></div>`:""}
      </div>

      <p class="footer-note">Repères juridiques et chronologiques du TFP APS · ${total} questions au total.</p>
    </section>`;

  app.querySelectorAll("[data-dl]").forEach(btn=>{
    btn.addEventListener("click", ()=>{
      const c = btn.dataset.dl;
      dlCount = c==="max" ? "max" : Number(c);
      renderDL();
    });
  });
  document.getElementById("dlShuffle").addEventListener("change", e=>{ shuffleOpts = e.target.checked; });
  document.getElementById("dlStart").addEventListener("click", ()=>startDL(dlCount));
}

let openSheet = null; // titre de la fiche ouverte
function renderRevisions(){
  progressRail.hidden = true;
  setActiveNav("revisions");
  const nbLois = LAWS.reduce((s,g)=>s+g.items.length,0);
  const uvs = [...new Set(SHEETS.map(s=>s.uv))].sort();
  const groups = uvs.map(uv=>{
    const cards = SHEETS.filter(s=>s.uv===uv).map(s=>{
      const open = openSheet===s.title;
      return `<div class="sheet-card">
        <button class="sheet-btn" data-sheet="${esc(s.title)}" aria-expanded="${open}">
          <span class="sc-chevron"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"><path d="M9 6l6 6-6 6"/></svg></span>
          <span class="sc-name">${esc(s.title)}</span>
        </button>
        ${open?`<div class="sheet-body">
          <ul>${s.pts.map(p=>`<li><span>${p}</span></li>`).join("")}</ul>
          <div class="sheet-key"><b>À retenir&nbsp;:</b> ${esc(s.key)}</div>
        </div>`:""}
      </div>`;
    }).join("");
    return `<div class="sheet-uv">
      <div class="sheet-uvtitle">${uv} · ${UV_META[uv]?UV_META[uv].name:""}</div>
      ${cards}
    </div>`;
  }).join("");

  app.innerHTML = `
    <section class="sheets">
      <div class="sheets-head">
        <span class="eyebrow">Révision</span>
        <h1>Réviser</h1>
        <p>Commencez par les lois &amp; dates, puis parcourez l'essentiel de chaque module et sous-module. Touchez une fiche pour la dérouler.</p>
      </div>

      <div class="sheet-uvtitle" style="margin-top:0">Lois &amp; dates</div>
      <button class="rev-portal" id="toLaws">
        <span class="rp-ic"><svg width="23" height="23" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 19.5A2.5 2.5 0 0 1 6.5 17H20"/><path d="M6.5 2H20v20H6.5A2.5 2.5 0 0 1 4 19.5v-15A2.5 2.5 0 0 1 6.5 2z"/></svg></span>
        <span class="rp-txt"><b>Tous les textes de loi</b><small>${nbLois} articles &amp; dates, classés par priorité d'examen</small></span>
        <span class="rp-chev"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M9 6l6 6-6 6"/></svg></span>
      </button>

      <div class="sheet-uvtitle">Modules &amp; sous-modules</div>
      ${groups}

      <p class="footer-note">${SHEETS.length} fiches · ${nbLois} références de loi · synthèse des supports CFPS, à compléter par le cours complet.</p>
    </section>`;

  document.getElementById("toLaws").addEventListener("click", ()=>{ renderReference(); window.scrollTo({top:0}); });
  app.querySelectorAll("[data-sheet]").forEach(btn=>{
    btn.addEventListener("click", ()=>{
      const t = btn.dataset.sheet;
      openSheet = (openSheet===t) ? null : t;
      renderRevisions();
    });
  });
}
