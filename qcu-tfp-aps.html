<meta name="claude:viewport-fit-sides" content="cover">
<title>QCU TFP APS</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wght@500;700;800&family=Source+Sans+3:wght@400;600;700&family=Spectral:ital,wght@0,500;0,600;0,700;1,500&display=swap">
<style>
  /* Layout : écran de révision centré, une colonne ; bandeau sticky + cartes de question */
  :root{
    --bg:#eef1f5;
    --surface:#ffffff;
    --surface-2:#f4f6fa;
    --ink:#131a26;
    --ink-soft:#4a566b;
    --line:#d9dfe9;
    --navy:#152439;
    --navy-ink:#f3f6fb;
    --flame:#d8352a;
    --flame-soft:#fbe7e5;
    --good:#1f8a4c;
    --good-soft:#e3f4ea;
    --bad:#c22f28;
    --bad-soft:#fbe6e4;
    --accent:#2f6fd0;
    --amber:#b5790c;
    --amber-soft:#f8efd8;
    --shadow:0 1px 2px rgba(19,26,38,.06), 0 8px 24px rgba(19,26,38,.07);
    --font-serif:"Spectral", Georgia, "Times New Roman", serif;
    color-scheme:light;
  }
  @media (prefers-color-scheme:dark){
    :root:not([data-theme="light"]){
      --bg:#0c1118;
      --surface:#141c28;
      --amber:#e0a94a;
      --amber-soft:#2c2411;
      --surface-2:#1b2535;
      --ink:#e9eef6;
      --ink-soft:#9aa7bd;
      --line:#2a3647;
      --navy:#0f1a2b;
      --navy-ink:#eef3fb;
      --flame:#f06a5f;
      --flame-soft:#38211f;
      --good:#56c98a;
      --good-soft:#15291e;
      --bad:#f0837b;
      --bad-soft:#331a19;
      --accent:#6fa6f0;
      --shadow:0 1px 2px rgba(0,0,0,.4), 0 10px 28px rgba(0,0,0,.5);
      color-scheme:dark;
    }
  }
  :root[data-theme="dark"]{
    --bg:#0c1118;
    --surface:#141c28;
    --amber:#e0a94a;
    --amber-soft:#2c2411;
    --surface-2:#1b2535;
    --ink:#e9eef6;
    --ink-soft:#9aa7bd;
    --line:#2a3647;
    --navy:#0f1a2b;
    --navy-ink:#eef3fb;
    --flame:#f06a5f;
    --flame-soft:#38211f;
    --good:#56c98a;
    --good-soft:#15291e;
    --bad:#f0837b;
    --bad-soft:#331a19;
    --accent:#6fa6f0;
    --shadow:0 1px 2px rgba(0,0,0,.4), 0 10px 28px rgba(0,0,0,.5);
    color-scheme:dark;
  }

  *{box-sizing:border-box}
  body{
    background:var(--bg);
    color:var(--ink);
    font-family:"Source Sans 3", ui-sans-serif, system-ui, -apple-system, "Segoe UI", sans-serif;
    line-height:1.5;
    -webkit-font-smoothing:antialiased;
  }
  h1,h2,h3,.display{font-family:"Archivo", ui-sans-serif, system-ui, sans-serif}
  .tnum{font-variant-numeric:tabular-nums}

  .wrap{
    max-width:720px;
    margin:0 auto;
    padding-left:max(16px, env(safe-area-inset-left,0px));
    padding-right:max(16px, env(safe-area-inset-right,0px));
    padding-block:0 48px;
  }

  /* ---- Header ---- */
  header.top{
    background:var(--navy);
    color:var(--navy-ink);
    position:sticky;
    top:env(safe-area-inset-top,0px);
    z-index:20;
    border-bottom:1px solid rgba(255,255,255,.08);
  }
  body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:21;background:var(--navy)}
  .top-inner{
    max-width:720px;margin:0 auto;
    padding-left:max(16px, env(safe-area-inset-left,0px));
    padding-right:max(16px, env(safe-area-inset-right,0px));
    padding-block:12px;
    display:flex;align-items:center;gap:12px;
  }
  .brand{display:flex;align-items:center;gap:10px;min-width:0}
  .flame{flex:none;width:30px;height:30px}
  .brand .t1{font-family:"Archivo";font-weight:800;font-size:1.05rem;letter-spacing:.02em;line-height:1}
  .brand .t2{font-size:.72rem;color:#aebbd0;letter-spacing:.14em;text-transform:uppercase;margin-top:3px}
  .top-spacer{flex:1}
  .ghost-btn{
    flex:none;background:rgba(255,255,255,.08);color:var(--navy-ink);
    border:1px solid rgba(255,255,255,.16);border-radius:9px;
    padding:7px 10px;font-size:.82rem;cursor:pointer;font-family:inherit;
    display:inline-flex;align-items:center;gap:6px;
  }
  .ghost-btn:hover{background:rgba(255,255,255,.15)}

  /* ---- Bouton menu (hamburger) ---- */
  .menu-btn{flex:none;display:grid;place-items:center;width:38px;height:38px;border-radius:10px;
    background:rgba(255,255,255,.08);color:var(--navy-ink);border:1px solid rgba(255,255,255,.16);
    cursor:pointer;transition:background .15s;}
  .menu-btn:hover{background:rgba(255,255,255,.16)}

  /* ---- Menu latéral (drawer) ---- */
  .drawer-overlay{position:fixed;inset:0;background:rgba(8,13,22,.5);z-index:40;
    opacity:0;pointer-events:none;transition:opacity .22s ease;}
  .drawer-overlay.open{opacity:1;pointer-events:auto}
  .drawer{position:fixed;top:0;bottom:0;left:0;z-index:41;width:min(84vw,330px);
    background:var(--surface);border-right:1px solid var(--line);
    box-shadow:0 0 40px rgba(0,0,0,.28);
    display:flex;flex-direction:column;
    transform:translateX(-102%);transition:transform .26s cubic-bezier(.4,0,.2,1);
    padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);
    padding-left:env(safe-area-inset-left,0px);}
  .drawer.open{transform:none}
  .drawer-head{display:flex;align-items:center;justify-content:space-between;
    padding:16px 16px 12px;font-family:"Archivo",sans-serif;font-weight:800;font-size:1.05rem;
    letter-spacing:.02em;border-bottom:1px solid var(--line);}
  .drawer-close{display:grid;place-items:center;width:34px;height:34px;border-radius:9px;
    background:var(--surface-2);color:var(--ink);border:1px solid var(--line);cursor:pointer}
  .drawer-close:hover{background:var(--line)}
  .drawer-nav{flex:1;overflow-y:auto;padding:12px;display:flex;flex-direction:column;gap:6px}
  .drawer-group{font-size:.72rem;letter-spacing:.14em;text-transform:uppercase;font-weight:700;
    color:var(--ink-soft);padding:12px 10px 4px}
  .drawer-item{display:flex;align-items:center;gap:13px;width:100%;text-align:left;
    background:none;border:1.5px solid transparent;border-radius:12px;padding:11px 12px;cursor:pointer;
    color:var(--ink);font-family:inherit;transition:background .14s, border-color .14s;}
  .drawer-item:hover{background:var(--surface-2)}
  .drawer-item[aria-current="true"]{background:var(--flame-soft);border-color:var(--flame)}
  .di-ic{flex:none;display:grid;place-items:center;width:38px;height:38px;border-radius:10px;
    background:var(--surface-2);color:var(--flame);border:1px solid var(--line)}
  .drawer-item[aria-current="true"] .di-ic{background:var(--flame);color:#fff;border-color:var(--flame)}
  .di-txt{flex:1;min-width:0;display:flex;flex-direction:column}
  .di-txt b{font-family:"Archivo",sans-serif;font-weight:700;font-size:.98rem}
  .di-txt small{color:var(--ink-soft);font-size:.8rem;margin-top:1px}
  .drawer-foot{padding:12px 16px;border-top:1px solid var(--line);font-size:.74rem;color:var(--ink-soft)}

  /* ---- Carte d'entrée vers les Textes de loi (page Révisions) ---- */
  .rev-portal{width:100%;display:flex;align-items:center;gap:14px;text-align:left;cursor:pointer;
    background:var(--navy);color:var(--navy-ink);border:none;border-radius:16px;padding:18px 18px;
    box-shadow:var(--shadow);transition:filter .15s}
  .rev-portal:hover{filter:brightness(1.12)}
  .rev-portal .rp-ic{flex:none;display:grid;place-items:center;width:46px;height:46px;border-radius:12px;
    background:rgba(255,255,255,.1);color:#fff;border:1px solid rgba(255,255,255,.18)}
  .rev-portal .rp-txt{flex:1;min-width:0;display:flex;flex-direction:column}
  .rev-portal .rp-txt b{font-family:var(--font-serif);font-weight:700;font-size:1.12rem}
  .rev-portal .rp-txt small{color:#c3cfe0;font-size:.84rem;margin-top:2px}
  .rev-portal .rp-chev{flex:none;color:#aebbd0}

  /* progress bar under header during quiz */
  .progress-rail{height:4px;background:rgba(255,255,255,.12);width:100%}
  .progress-fill{height:100%;background:var(--flame);width:0;transition:width .3s ease}

  /* ---- Fiches de révision simplifiées ---- */
  .sheets{margin-top:20px;display:flex;flex-direction:column;gap:16px}
  .sheets-head h1{font-family:var(--font-serif);font-weight:700;font-size:1.6rem;line-height:1.1;margin:.3rem 0 .4rem}
  .sheets-head .eyebrow{color:var(--accent)}
  .sheets-head p{margin:0;color:var(--ink-soft);font-size:.92rem;max-width:60ch}
  .sheet-uv{display:flex;flex-direction:column;gap:9px}
  .sheet-uvtitle{font-size:.76rem;letter-spacing:.12em;text-transform:uppercase;font-weight:700;color:var(--flame);margin:6px 2px 0}
  .sheet-card{border:1.5px solid var(--line);border-radius:14px;background:var(--surface);overflow:hidden;box-shadow:var(--shadow)}
  .sheet-btn{width:100%;display:flex;align-items:center;gap:11px;padding:14px 15px;background:none;border:none;cursor:pointer;color:var(--ink);text-align:left;font-family:inherit}
  .sheet-btn:hover{background:var(--surface-2)}
  .sheet-btn .sc-chevron{flex:none;color:var(--flame);transition:transform .2s ease}
  .sheet-btn[aria-expanded="true"] .sc-chevron{transform:rotate(90deg)}
  .sheet-btn .sc-name{flex:1;min-width:0;font-family:var(--font-serif);font-weight:700;font-size:1.04rem}
  .sheet-body{padding:2px 16px 16px;border-top:1px solid var(--line)}
  .sheet-body ul{margin:12px 0 0;padding:0;list-style:none;display:flex;flex-direction:column;gap:9px}
  .sheet-body li{display:flex;gap:10px;font-size:.92rem;line-height:1.5}
  .sheet-body li::before{content:"";flex:none;width:7px;height:7px;border-radius:50%;background:var(--flame);margin-top:8px}
  .sheet-body li b{font-weight:700}
  .sheet-key{margin-top:13px;border-left:3px solid var(--accent);background:var(--surface-2);border-radius:0 10px 10px 0;padding:10px 13px;font-size:.88rem}
  .sheet-key b{color:var(--accent);font-family:"Archivo",sans-serif}

  /* ---- generic ---- */
  .card{background:var(--surface);border:1px solid var(--line);border-radius:16px;box-shadow:var(--shadow)}
  .eyebrow{font-size:.72rem;letter-spacing:.16em;text-transform:uppercase;color:var(--flame);font-weight:700}
  .muted{color:var(--ink-soft)}
  button{font-family:inherit}

  /* ---- Setup screen ---- */
  .setup{margin-top:24px;display:flex;flex-direction:column;gap:18px}
  .intro h1{font-size:1.7rem;line-height:1.1;margin:.4rem 0 .5rem;text-wrap:balance}
  .intro p{margin:0;color:var(--ink-soft);max-width:60ch}

  .section-label{font-size:.8rem;font-weight:700;letter-spacing:.04em;color:var(--ink-soft);text-transform:uppercase;margin-bottom:2px}

  .theme-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
  @media (max-width:460px){.theme-grid{grid-template-columns:1fr}}
  .theme-tile{
    display:flex;flex-direction:column;gap:3px;text-align:left;
    background:var(--surface);border:1.5px solid var(--line);border-radius:13px;
    padding:13px 14px;cursor:pointer;position:relative;transition:border-color .15s, background .15s;
  }
  .theme-tile:hover{border-color:var(--accent)}
  .theme-tile[aria-pressed="true"]{border-color:var(--flame);background:var(--flame-soft)}
  .theme-tile .tt-top{display:flex;align-items:center;justify-content:space-between;gap:8px}
  .theme-tile .uv{font-size:.68rem;font-weight:800;letter-spacing:.08em;color:var(--flame);text-transform:uppercase}
  .theme-tile .tt-name{font-family:"Archivo";font-weight:700;font-size:1.02rem;line-height:1.15}
  .theme-tile .count{font-size:.78rem;color:var(--ink-soft)}
  .check{width:20px;height:20px;border-radius:50%;border:1.5px solid var(--line);flex:none;display:grid;place-items:center}
  .theme-tile[aria-pressed="true"] .check{background:var(--flame);border-color:var(--flame)}
  .check svg{width:12px;height:12px;opacity:0}
  .theme-tile[aria-pressed="true"] .check svg{opacity:1}

  /* ---- Accordéon par UV ---- */
  .uv-list{display:flex;flex-direction:column;gap:10px}
  .uv-group{border:1.5px solid var(--line);border-radius:14px;overflow:hidden;background:var(--surface)}
  .uv-head{width:100%;display:flex;align-items:center;gap:12px;padding:14px 15px;background:none;border:none;cursor:pointer;text-align:left;color:var(--ink)}
  .uv-head:hover{background:var(--surface-2)}
  .uv-chevron{flex:none;transition:transform .2s ease;color:var(--flame);display:grid;place-items:center}
  .uv-head[aria-expanded="true"] .uv-chevron{transform:rotate(90deg)}
  .uv-head-txt{flex:1;min-width:0}
  .uv-code{font-family:"Archivo";font-weight:700;font-size:1.04rem;line-height:1.15}
  .uv-sub{font-size:.8rem;color:var(--ink-soft);margin-top:2px}
  .uv-badge{flex:none;font-size:.74rem;font-weight:700;background:var(--surface-2);border:1px solid var(--line);color:var(--ink-soft);border-radius:999px;padding:3px 10px;font-variant-numeric:tabular-nums}
  .uv-badge.on{background:var(--flame);border-color:var(--flame);color:#fff}
  .uv-body{display:flex;flex-direction:column;gap:9px;padding:0 12px 14px;border-top:1px solid var(--line)}
  .uv-tools{display:flex;justify-content:flex-end;padding-top:10px}
  .uv-selectall{background:none;border:none;color:var(--accent);font-size:.82rem;font-weight:600;cursor:pointer;padding:4px 2px;font-family:inherit}
  .uv-selectall:hover{text-decoration:underline}

  .pills{display:flex;flex-wrap:wrap;gap:8px}
  .pill{
    background:var(--surface);border:1.5px solid var(--line);border-radius:999px;
    padding:8px 15px;font-size:.9rem;cursor:pointer;color:var(--ink);
    font-variant-numeric:tabular-nums;transition:border-color .15s, background .15s;
  }
  .pill[aria-pressed="true"]{border-color:var(--flame);background:var(--flame);color:#fff}
  @media (prefers-color-scheme:dark){:root:not([data-theme="light"]) .pill[aria-pressed="true"]{color:#0c1118}}
  :root[data-theme="dark"] .pill[aria-pressed="true"]{color:#0c1118}

  .toggle-row{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:12px 2px}
  .switch{position:relative;width:46px;height:26px;flex:none}
  .switch input{position:absolute;opacity:0;width:100%;height:100%;margin:0;cursor:pointer}
  .slider{position:absolute;inset:0;background:var(--line);border-radius:999px;transition:background .15s}
  .slider::before{content:"";position:absolute;width:20px;height:20px;left:3px;top:3px;background:#fff;border-radius:50%;transition:transform .15s;box-shadow:0 1px 3px rgba(0,0,0,.3)}
  .switch input:checked + .slider{background:var(--flame)}
  .switch input:checked + .slider::before{transform:translateX(20px)}

  .start-btn{
    width:100%;background:var(--flame);color:#fff;border:none;border-radius:13px;
    padding:16px;font-size:1.08rem;font-weight:700;font-family:"Archivo";cursor:pointer;
    display:flex;align-items:center;justify-content:center;gap:10px;letter-spacing:.01em;
  }
  .start-btn:disabled{opacity:.45;cursor:not-allowed}
  .start-btn:not(:disabled):hover{filter:brightness(1.05)}

  .best{display:flex;align-items:center;gap:8px;font-size:.85rem;color:var(--ink-soft);justify-content:center}

  /* ---- Quiz screen ---- */
  .quiz{margin-top:20px;display:flex;flex-direction:column;gap:16px}
  .q-meta{display:flex;align-items:center;justify-content:space-between;gap:10px;font-size:.82rem}
  .q-tag{display:inline-flex;align-items:center;gap:6px;background:var(--surface-2);border:1px solid var(--line);border-radius:999px;padding:4px 11px;font-weight:600;color:var(--ink-soft)}
  .q-counter{color:var(--ink-soft);font-weight:600}
  .q-card{padding:20px}
  .q-text{font-family:"Archivo";font-weight:700;font-size:1.22rem;line-height:1.3;margin:0 0 4px;text-wrap:balance}
  .q-hint{font-size:.8rem;color:var(--ink-soft);margin-bottom:14px}
  .options{display:flex;flex-direction:column;gap:10px;margin-top:10px}
  .opt{
    display:flex;align-items:flex-start;gap:12px;width:100%;text-align:left;
    background:var(--surface);border:1.5px solid var(--line);border-radius:12px;
    padding:13px 14px;cursor:pointer;font-size:1rem;color:var(--ink);transition:border-color .12s, background .12s;
  }
  .opt:not(:disabled):hover{border-color:var(--accent)}
  .opt .letter{
    flex:none;width:26px;height:26px;border-radius:7px;background:var(--surface-2);
    border:1px solid var(--line);display:grid;place-items:center;font-weight:700;font-size:.85rem;font-family:"Archivo";
  }
  .opt .otxt{flex:1;min-width:0;padding-top:2px}
  .opt .mark{flex:none;width:22px;height:22px;opacity:0;transition:opacity .15s}
  .opt.correct{border-color:var(--good);background:var(--good-soft)}
  .opt.correct .letter{background:var(--good);border-color:var(--good);color:#fff}
  .opt.correct .mark{opacity:1;color:var(--good)}
  .opt.wrong{border-color:var(--bad);background:var(--bad-soft)}
  .opt.wrong .letter{background:var(--bad);border-color:var(--bad);color:#fff}
  .opt.wrong .mark{opacity:1;color:var(--bad)}
  .opt:disabled{cursor:default}
  .opt.dim{opacity:.6}

  .explain{
    margin-top:14px;border-left:3px solid var(--accent);background:var(--surface-2);
    border-radius:0 10px 10px 0;padding:12px 14px;font-size:.92rem;
  }
  .explain .ex-head{font-weight:700;font-family:"Archivo";margin-bottom:3px;display:flex;align-items:center;gap:7px}
  .explain.ok .ex-head{color:var(--good)}
  .explain.ko .ex-head{color:var(--bad)}
  .explain.ok{border-left-color:var(--good)}
  .explain.ko{border-left-color:var(--bad)}

  .next-btn{
    width:100%;background:var(--navy);color:var(--navy-ink);border:none;border-radius:12px;
    padding:14px;font-size:1rem;font-weight:700;font-family:"Archivo";cursor:pointer;
    display:flex;align-items:center;justify-content:center;gap:9px;
  }
  .next-btn:hover{filter:brightness(1.12)}
  .quit-link{background:none;border:none;color:var(--ink-soft);font-size:.85rem;cursor:pointer;text-decoration:underline;padding:6px;align-self:center}

  /* ---- Results ---- */
  .results{margin-top:24px;display:flex;flex-direction:column;gap:16px}
  .score-card{padding:26px 20px;text-align:center;display:flex;flex-direction:column;align-items:center;gap:6px}
  .ring{position:relative;width:150px;height:150px;margin:4px 0}
  .ring svg{transform:rotate(-90deg)}
  .ring .pct{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center}
  .ring .pct b{font-family:"Archivo";font-size:2.3rem;line-height:1;font-variant-numeric:tabular-nums}
  .ring .pct span{font-size:.8rem;color:var(--ink-soft)}
  .verdict{font-family:"Archivo";font-weight:800;font-size:1.3rem;margin-top:4px}
  .verdict.pass{color:var(--good)}
  .verdict.fail{color:var(--flame)}
  .score-sub{color:var(--ink-soft);font-size:.95rem}
  .breakdown{display:flex;flex-direction:column;gap:9px;padding:16px 18px}
  .bd-row{display:flex;align-items:center;gap:12px;font-size:.9rem}
  .bd-row .bd-name{flex:1;min-width:0}
  .bd-bar{flex:none;width:90px;height:7px;border-radius:999px;background:var(--surface-2);overflow:hidden}
  .bd-bar i{display:block;height:100%;background:var(--accent);border-radius:999px}
  .bd-score{flex:none;font-variant-numeric:tabular-nums;font-weight:700;width:46px;text-align:right}

  .review{display:flex;flex-direction:column;gap:12px}
  .rv-title{font-family:"Archivo";font-weight:800;font-size:1.1rem;margin:8px 2px 0}
  .rv-card{padding:15px 16px}
  .rv-q{font-weight:700;font-family:"Archivo";font-size:1rem;margin:0 0 9px;display:flex;gap:9px}
  .rv-q .ic{flex:none;margin-top:2px}
  .rv-line{font-size:.9rem;display:flex;gap:7px;padding:2px 0}
  .rv-line .lab{flex:none;font-weight:700;width:68px;color:var(--ink-soft)}
  .rv-line.good .val{color:var(--good);font-weight:600}
  .rv-line.bad .val{color:var(--bad);font-weight:600}
  .rv-exp{font-size:.86rem;color:var(--ink-soft);margin-top:7px;padding-top:7px;border-top:1px dashed var(--line)}

  .actions{display:flex;flex-direction:column;gap:10px;margin-top:6px}
  .footer-note{margin-top:30px;font-size:.78rem;color:var(--ink-soft);text-align:center;line-height:1.6}

  /* ---- Bouton vers la fiche des textes de loi ---- */
  .ref-btn{width:100%;display:flex;align-items:center;gap:13px;background:var(--surface);border:1.5px solid var(--line);border-radius:13px;padding:14px 16px;cursor:pointer;color:var(--ink);text-align:left}
  .ref-btn:hover{border-color:var(--accent);background:var(--surface-2)}
  .ref-btn > svg:first-child{flex:none;color:var(--flame)}
  .ref-btn span{flex:1;min-width:0;display:flex;flex-direction:column}
  .ref-btn b{font-family:"Archivo";font-size:1rem}
  .ref-btn small{color:var(--ink-soft);font-size:.82rem}
  .ref-btn .chev{flex:none;color:var(--ink-soft)}

  /* ---- Page des textes de loi ---- */
  .ref-page{margin-top:18px;display:flex;flex-direction:column;gap:16px}
  .ref-head h1{font-family:"Archivo";font-size:1.5rem;line-height:1.1;margin:.4rem 0 .4rem;text-wrap:balance}
  .ref-head p{margin:0;color:var(--ink-soft);font-size:.92rem;max-width:60ch}
  .ref-search{position:sticky;top:calc(env(safe-area-inset-top,0px) + 8px);z-index:5}
  .ref-search input{width:100%;padding:12px 14px 12px 40px;border:1.5px solid var(--line);border-radius:11px;background:var(--surface);color:var(--ink);font-family:inherit;font-size:.95rem}
  .ref-search{position:relative}
  .ref-search svg{position:absolute;left:13px;top:50%;transform:translateY(-50%);color:var(--ink-soft);pointer-events:none}
  .law-group{border:1.5px solid var(--line);border-radius:14px;overflow:hidden;background:var(--surface)}
  .law-gtitle{display:flex;align-items:center;gap:9px;padding:11px 15px;background:var(--surface-2);border-bottom:1px solid var(--line);font-family:"Archivo";font-weight:700;font-size:.98rem}
  .law-gtitle .dot{flex:none;width:9px;height:9px;border-radius:50%;background:var(--flame)}
  .law-row{display:flex;gap:13px;padding:11px 15px;align-items:baseline}
  .law-row + .law-row{border-top:1px solid var(--line)}
  .law-ref{flex:none;width:118px;font-weight:700;font-size:.86rem;color:var(--accent);font-variant-numeric:tabular-nums}
  .law-body{flex:1;min-width:0}
  .law-title{font-weight:600;font-size:.94rem}
  .law-note{color:var(--ink-soft);font-size:.86rem;margin-top:1px}
  .law-empty{text-align:center;color:var(--ink-soft);padding:30px 10px;font-size:.92rem}

  /* ---- Encadré « à connaître par cœur » ---- */
  .feat{border:1.5px solid var(--flame);border-radius:14px;background:var(--flame-soft);padding:15px 16px;display:flex;flex-direction:column;gap:13px}
  .feat-head{display:flex;align-items:center;gap:8px;font-family:"Archivo";font-weight:800;font-size:1.02rem;color:var(--flame)}
  .feat-arts{display:flex;flex-direction:column;gap:9px}
  .feat-art{display:flex;gap:11px;align-items:baseline;background:var(--surface);border-radius:10px;padding:10px 12px}
  .feat-art .fa-ref{flex:none;width:92px;font-family:"Archivo";font-weight:700;font-size:.9rem;color:var(--flame)}
  .feat-art .fa-body{flex:1;min-width:0;font-size:.9rem}
  .feat-art .fa-body b{font-weight:700}
  .feat-dates-label{font-size:.76rem;letter-spacing:.1em;text-transform:uppercase;font-weight:700;color:var(--ink-soft)}
  .feat-dates{display:flex;flex-wrap:wrap;gap:7px}
  .date-chip{background:var(--surface);border:1px solid var(--line);border-radius:999px;padding:5px 11px;font-size:.82rem;font-variant-numeric:tabular-nums}
  .date-chip b{color:var(--flame);font-weight:700}
  @media (max-width:460px){
    .feat-art{flex-direction:column;gap:3px}
    .feat-art .fa-ref{width:auto}
  }

  /* ---- Ambiance académique (page révision) ---- */
  .ref-head h1{font-family:var(--font-serif);font-weight:700;font-size:1.78rem;letter-spacing:-.01em}
  .ref-head .eyebrow{color:var(--accent)}
  .law-gtitle{font-family:var(--font-serif);font-weight:700;font-size:1.06rem;letter-spacing:.01em;gap:11px}
  .law-gtitle .dot{display:none}
  .feat-head{font-family:var(--font-serif)}
  .law-group{box-shadow:var(--shadow)}
  .law-title{font-family:var(--font-serif);font-weight:600;font-size:1rem}
  .law-ref{font-family:"Archivo",sans-serif}
  .law-gcount{margin-left:auto;font-family:"Source Sans 3",sans-serif;font-weight:600;font-size:.76rem;color:var(--ink-soft);background:var(--surface);border:1px solid var(--line);border-radius:999px;padding:2px 9px;font-variant-numeric:tabular-nums}

  /* ---- Échelle des priorités ---- */
  .prio-scale{border:1.5px solid var(--line);border-radius:14px;background:var(--surface);padding:15px 16px;display:flex;flex-direction:column;gap:12px;box-shadow:var(--shadow)}
  .prio-scale-head{font-family:var(--font-serif);font-weight:700;font-size:1.02rem;display:flex;align-items:center;gap:8px}
  .prio-bar{display:flex;height:9px;border-radius:999px;overflow:hidden}
  .prio-bar span{flex:1}
  .prio-bar .s1{background:var(--flame)}
  .prio-bar .s2{background:var(--amber)}
  .prio-bar .s3{background:var(--accent)}
  .prio-rows{display:flex;flex-direction:column;gap:8px}
  .prio-row{display:flex;gap:11px;align-items:baseline;font-size:.88rem}
  .prio-row .pd{flex:1;min-width:0;color:var(--ink-soft)}
  .prio-row .pd b{color:var(--ink);font-weight:600}
  .pbadge{flex:none;display:inline-flex;align-items:center;font-family:"Archivo",sans-serif;font-weight:700;font-size:.72rem;letter-spacing:.02em;border-radius:999px;padding:3px 10px;text-transform:uppercase;white-space:nowrap}
  .pbadge.p1{background:var(--flame-soft);color:var(--flame);border:1px solid var(--flame)}
  .pbadge.p2{background:var(--amber-soft);color:var(--amber);border:1px solid var(--amber)}
  .pbadge.p3{background:var(--surface-2);color:var(--accent);border:1px solid var(--accent)}
  @media (max-width:460px){
    .law-row{flex-direction:column;gap:3px}
    .law-ref{width:auto}
  }

  :focus-visible{outline:2.5px solid var(--accent);outline-offset:2px}
  @media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>

<script>
/* ===================== BANQUE DE QUESTIONS ===================== *
 * Issues des fiches de révision CFPS fournies.
 * Chaque question : une seule bonne réponse (QCU).
 * answer = index de la bonne réponse dans options (avant mélange).
 * ============================================================== */
const THEMES = {
  incendie:   { uv:"UV05", name:"Incendie", short:"Incendie" },
  republique: { uv:"UV02", name:"Principes de la République", short:"République" },
  penal:      { uv:"UV02", name:"Code pénal", short:"Code pénal" },
  livre6:     { uv:"UV02", name:"Livre VI · CNAPS · Carte pro", short:"Livre VI" },
  deonto:     { uv:"UV02", name:"Code de déontologie", short:"Déontologie" },
  libertes:   { uv:"UV02", name:"Respect des libertés publiques", short:"Libertés publiques" },
  apprehension:{ uv:"UV02", name:"Conditions d'appréhension", short:"Appréhension" },
  filieres:   { uv:"UV06", name:"Filières métiers", short:"Filières métiers" },
  modalites:  { uv:"UV06", name:"Modalités d'appréhension (en exercice)", short:"Appréhension (exercice)" },
  telesurv:   { uv:"UV10", name:"Télésurveillance & Vidéoprotection", short:"Télésurveillance" },
  accueil:    { uv:"UV08", name:"Accueil & contrôle d'accès", short:"Accueil & contrôle" },
  communication:{ uv:"UV08", name:"Techniques d'information & communication", short:"Communication" },
  strategique:{ uv:"UV04", name:"Module stratégique (transmission)", short:"Module stratégique" },
};

const BANK = [
  /* ---------------- INCENDIE (UV05) ---------------- */
  { t:"incendie", q:"Comment définit-on un incendie ?", o:[
    "Un feu violent qui échappe au contrôle de l'homme dans l'espace et dans le temps",
    "Toute flamme visible, même maîtrisée",
    "Une combustion lente sans flamme",
    "Une simple montée de température dans un local"], a:0,
    e:"Un incendie est un feu violent qui échappe au contrôle de l'homme dans l'espace et dans le temps. La priorité absolue reste le sauvetage et l'évacuation des personnes." },
  { t:"incendie", q:"Quels sont les trois éléments du triangle du feu ?", o:[
    "Combustible, comburant, énergie d'activation",
    "Chaleur, fumée, flamme",
    "Oxygène, eau, chaleur",
    "Combustible, fumée, étincelle"], a:0,
    e:"Le feu naît de la réunion du combustible, du comburant et d'une énergie d'activation. Supprimer un seul de ces éléments éteint le feu." },
  { t:"incendie", q:"Dans le triangle du feu, l'oxygène de l'air joue le rôle de :", o:[
    "Comburant","Combustible","Énergie d'activation","Inhibiteur"], a:0,
    e:"L'oxygène (environ 21 % de l'air) est le comburant. Attention au piège : si une proposition dit que l'oxygène est le combustible, elle est fausse." },
  { t:"incendie", q:"Le mode d'extinction par étouffement consiste à :", o:[
    "Empêcher l'apport d'oxygène (supprimer le comburant)",
    "Abaisser la température",
    "Empêcher l'apport de combustible",
    "Empêcher la réaction chimique"], a:0,
    e:"Étouffer = priver le feu d'oxygène. Refroidir supprime l'énergie d'activation, la coupure d'alimentation supprime le combustible, l'inhibition casse la réaction chimique." },
  { t:"incendie", q:"Le refroidissement comme mode d'extinction permet de supprimer :", o:[
    "L'énergie d'activation","Le comburant","Le combustible","La réaction en chaîne"], a:0,
    e:"Refroidir, c'est abaisser la température et donc supprimer l'énergie d'activation du triangle du feu." },
  { t:"incendie", q:"La propagation de la chaleur par les mouvements ascendants des fumées et gaz chauds s'appelle :", o:[
    "La convection","La conduction","Le rayonnement","La projection"], a:0,
    e:"Convection = transport de chaleur par les fumées et gaz chauds qui montent. La conduction passe par la masse d'un solide, le rayonnement par ondes électromagnétiques." },
  { t:"incendie", q:"À quelle classe de feu appartiennent le bois, le carton, le papier et le tissu ?", o:[
    "Classe A","Classe B","Classe C","Classe F"], a:0,
    e:"Classe A = feux secs de solides formant des braises. Classe B = liquides/gras, C = gaz, D = métaux, F = auxiliaires de cuisson." },
  { t:"incendie", q:"Les feux de gaz (butane, propane, hydrogène) relèvent de la classe :", o:[
    "Classe C","Classe A","Classe B","Classe D"], a:0,
    e:"Classe C = gaz. Le réflexe essentiel est de fermer la vanne : laisser la vanne ouverte crée un risque d'explosion." },
  { t:"incendie", q:"Sur un feu de métaux (classe D), que ne faut-il surtout pas utiliser ?", o:[
    "De l'eau","De la poudre D","Du sable sec","Du ciment sec"], a:0,
    e:"L'eau est interdite sur les feux de métaux (comme sur l'huile/graisse de cuisson et les batteries). On utilise poudre D, sable, ciment sec ou terre." },
  { t:"incendie", q:"Quelle est la première cause de mortalité lors d'un incendie ?", o:[
    "L'asphyxie (environ 80 %)","Les brûlures","L'effondrement","La panique"], a:0,
    e:"L'asphyxie est la première cause de décès (environ 80 % selon le support), à cause des fumées toxiques : vapeur d'eau, CO₂, monoxyde de carbone, suies..." },
  { t:"incendie", q:"Combien de dangers présente la fumée selon le support ?", o:[
    "5 dangers","3 dangers","7 dangers","2 dangers"], a:0,
    e:"Les 5 dangers de la fumée : toxiques, opaques, rayonnantes, inflammables/explosives, envahissantes/mobiles." },
  { t:"incendie", q:"L'extincteur au CO₂ s'emploie à quelle distance et par quel mode ?", o:[
    "À moins d'1 m, par étouffement","À 3-4 m, par inhibition","À 2-3 m, par refroidissement","À plus de 5 m, par projection"], a:0,
    e:"Le CO₂ (2 ou 5 kg) s'utilise à moins d'1 m, agit par étouffement et fonctionne en pression permanente." },
  { t:"incendie", q:"Quelle est la distance maximale à parcourir pour atteindre un extincteur ?", o:[
    "15 mètres","30 mètres","10 mètres","50 mètres"], a:0,
    e:"Distance de parcours : 15 m maximum. À ne pas confondre avec la distance entre deux extincteurs, qui est de 30 m maximum." },
  { t:"incendie", q:"À quelle hauteur la poignée d'un extincteur doit-elle se situer ?", o:[
    "1,20 m du sol","0,80 m du sol","1,50 m du sol","2 m du sol"], a:0,
    e:"La poignée de l'extincteur est placée à 1,20 m du sol pour une préhension rapide." },
  { t:"incendie", q:"Quel dispositif permet de repérer les extincteurs sous pression (eau/additif et poudre) ?", o:[
    "Le manomètre","Le plomb","La goupille","Le diffuseur"], a:0,
    e:"Le manomètre indique les appareils sous pression permanente. Le CO₂ fonctionne aussi en pression permanente mais sans manomètre." },
  { t:"incendie", q:"À quelle fréquence doivent avoir lieu, au minimum, les exercices et essais d'évacuation ?", o:[
    "Au moins tous les 6 mois","Tous les ans","Tous les 3 mois","Tous les 2 ans"], a:0,
    e:"Selon l'article R4227-39 cité dans le support, exercices et essais ont lieu au moins tous les six mois et sont consignés dans un registre." },
  { t:"incendie", q:"Pendant combien de temps l'éclairage de sécurité doit-il fonctionner au minimum ?", o:[
    "1 heure","30 minutes","2 heures","6 heures"], a:0,
    e:"L'éclairage de sécurité balise vers l'extérieur et doit fonctionner au minimum 1 heure en cas de défaillance de l'éclairage normal." },
  { t:"incendie", q:"Quel est le rôle du serre-file lors d'une évacuation ?", o:[
    "Fouiller les locaux et s'assurer que personne ne reste dans sa zone",
    "Conduire les personnes vers le point de rassemblement",
    "Donner l'ordre de réintégration",
    "Appeler directement les sapeurs-pompiers"], a:0,
    e:"Le serre-file ferme la marche : il contrôle la zone, accompagne les personnes et ne quitte sa zone qu'après s'être assuré que personne n'y reste. Le guide-file, lui, conduit vers le point de rassemblement." },
  { t:"incendie", q:"En cas d'incendie, quel est l'impératif n°1 pour l'agent de sécurité ?", o:[
    "Le sauvetage et l'évacuation des personnes",
    "Éteindre le feu coûte que coûte",
    "Protéger les biens de valeur",
    "Fermer toutes les issues"], a:0,
    e:"La priorité absolue est le sauvetage et l'évacuation du personnel et du public. L'ordre : protéger sans s'exposer → alerter → évacuer → rejoindre le rassemblement et rendre compte." },

  /* ---------------- PRINCIPES DE LA RÉPUBLIQUE (UV02) ---------------- */
  { t:"republique", q:"De quand date la Constitution française actuelle ?", o:[
    "Du 4 octobre 1958","Du 14 juillet 1789","Du 9 décembre 1905","Du 4 octobre 1848"], a:0,
    e:"La Constitution du 4 octobre 1958 est celle de la Ve République ; c'est la norme juridique suprême. Ses principes fondamentaux figurent à l'article 1er." },
  { t:"republique", q:"Selon l'article 1er, la France est une République :", o:[
    "Indivisible, laïque, démocratique et sociale",
    "Libre, égale, fraternelle et solidaire",
    "Unie, neutre, élue et sociale",
    "Indivisible, souveraine, laïque et fédérale"], a:0,
    e:"Formule à connaître par cœur : « La France est une République indivisible, laïque, démocratique et sociale. »" },
  { t:"republique", q:"Quelle est la devise de la République française ?", o:[
    "Liberté, Égalité, Fraternité",
    "Liberté, Dignité, Solidarité",
    "Égalité, Laïcité, Fraternité",
    "Unité, Liberté, Justice"], a:0,
    e:"La devise « Liberté, Égalité, Fraternité » est adoptée en 1848. Liberté et égalité viennent de la DDHC de 1789 ; la fraternité est affirmée dans le préambule de 1848." },
  { t:"republique", q:"Le qualificatif « laïque » de la République signifie que :", o:[
    "L'État est neutre à l'égard des cultes et garantit la liberté de conscience",
    "La religion est interdite dans l'espace public",
    "Seuls les cultes reconnus sont autorisés",
    "L'État finance tous les cultes"], a:0,
    e:"Laïcité = neutralité de l'État à l'égard des cultes + garantie de la liberté de conscience et du libre exercice des cultes dans le cadre de la loi." },
  { t:"republique", q:"Quel article du Code pénal interdit la discrimination ?", o:[
    "L'article 225-1","L'article 122-5","L'article R631-27","L'article 16 du Code civil"], a:0,
    e:"L'article 225-1 du Code pénal interdit de traiter moins favorablement une personne selon un critère prohibé (origine, sexe, âge, religion, handicap...)." },
  { t:"republique", q:"La loi de séparation des Églises et de l'État date du :", o:[
    "9 décembre 1905","4 octobre 1958","26 août 1789","15 février 1848"], a:0,
    e:"La loi du 9 décembre 1905 garantit la liberté de conscience et le libre exercice des cultes, sous les restrictions nécessaires à l'ordre public." },
  { t:"republique", q:"Qui a composé La Marseillaise ?", o:[
    "Rouget de Lisle (en 1792)","Marianne","Victor Hugo","Un auteur anonyme de 1789"], a:0,
    e:"L'hymne national a été composé par Rouget de Lisle dans la nuit du 25 au 26 avril 1792." },
  { t:"republique", q:"Que représente Marianne ?", o:[
    "L'allégorie de la République, coiffée du bonnet phrygien",
    "La première présidente française",
    "La déesse de la justice",
    "Le symbole de la monarchie"], a:0,
    e:"Marianne est l'allégorie de la République, coiffée du bonnet phrygien ; elle apparaît en 1792." },
  { t:"republique", q:"Quelles sont les trois composantes traditionnelles de l'ordre public ?", o:[
    "Tranquillité, sécurité, salubrité",
    "Liberté, égalité, fraternité",

    e:"Art. 73 CPP : en cas de crime flagrant ou de délit flagrant puni d'emprisonnement, toute personne a qualité pour appréhender l'auteur et le conduire devant l'OPJ le plus proche." },
  { t:"apprehension", q:"L'appréhension de l'article 73 est possible pour :", o:[
    "Un crime flagrant ou un délit flagrant puni d'emprisonnement",
    "Toute infraction, y compris les contraventions",
    "Les délits punis seulement d'une amende",
    "Toute personne suspecte"], a:0,
    e:"Condition à mémoriser : crime flagrant OU délit flagrant puni d'emprisonnement. Les contraventions et les délits punis seulement d'une amende sont exclus." },
  { t:"apprehension", q:"Dans le cadre de l'article 73, que peut faire l'APS ?", o:[
    "Appréhender et employer une force strictement nécessaire et proportionnée",
    "Fouiller la personne et ses bagages",
    "Demander une pièce d'identité",
    "Se comporter comme un OPJ"], a:0,
    e:"L'APS peut appréhender, employer une force strictement nécessaire et proportionnée, palper par sécurité et contrôler les bagages (L613-2/L613-3 CSI). Il ne peut PAS arrêter, fouiller, exiger une identité ou agir en OPJ." },
  { t:"apprehension", q:"Après avoir appréhendé l'auteur, à qui l'APS doit-il le remettre ?", o:[
    "À l'officier de police judiciaire (OPJ) le plus proche",
    "Au directeur du magasin",
    "Au CNAPS",
    "Au procureur directement"], a:0,
    e:"L'auteur est conduit ou mis à disposition de l'OPJ le plus proche (police nationale, gendarmerie nationale ou maire de la commune), après avoir avisé sans délai les services compétents." },
  { t:"apprehension", q:"L'APS dispose, en matière d'appréhension :", o:[
    "Des mêmes droits qu'un simple citoyen, dans les conditions prévues par la loi",
    "Des mêmes pouvoirs qu'un officier de police judiciaire",
    "D'un pouvoir de contrôle d'identité",
    "D'un droit de perquisition"], a:0,
    e:"L'APS n'est ni policier ni gendarme : il a les droits d'un citoyen. Il observe, protège, alerte et agit sans se substituer aux forces de l'ordre." },
  { t:"apprehension", q:"Le menottage (art. 803 du CPP) n'est possible que si la personne est :", o:[
    "Dangereuse pour autrui, pour elle-même, ou susceptible de prendre la fuite",
    "Suspectée d'une contravention",
    "Refusant de parler",
    "De mauvaise foi"], a:0,
    e:"Art. 803 : nul ne peut être menotté s'il n'est considéré comme dangereux pour autrui ou lui-même, ou susceptible de fuir. Le menottage n'est jamais automatique et l'APS en assume la responsabilité." },
  { t:"apprehension", q:"L'appréhension d'un mineur impose :", o:[
    "Un appel au responsable légal ou, à défaut, aux forces de l'ordre (appel obligatoire)",
    "Une simple surveillance jusqu'à sa libération",
    "Aucune formalité particulière",
    "Sa remise directe à ses parents sans autre démarche"], a:0,
    e:"Pour un mineur, l'appel devient obligatoire : il faut prévenir le responsable légal ou, à défaut, la police ou la gendarmerie." },
  { t:"apprehension", q:"Exercer une surveillance sur la voie publique sans autorisation préfectorale est puni de :", o:[
    "2 ans d'emprisonnement et 30 000 € d'amende",
    "6 mois et 7 500 €",
    "1 an et 15 000 €",
    "5 ans et 75 000 €"], a:0,
    e:"La surveillance sur la voie publique exige une autorisation préfectorale (à conserver pendant la vacation). L'exercer sans autorisation : 2 ans d'emprisonnement et 30 000 € d'amende." },
  { t:"apprehension", q:"En magasin, un portique antivol qui se déclenche constitue-t-il la preuve d'un vol ?", o:[
    "Non, c'est un simple indice ; le vol est constitué au passage en caisse sans payer ou à la sortie sans achat",
    "Oui, c'est une preuve suffisante",
    "Oui, cela autorise une fouille",
    "Oui, cela justifie une arrestation"], a:0,
    e:"Un portique déclenché est un indice, pas une preuve systématique. Le vol est constitué au passage en caisse sans payer ou à la sortie sans achat. L'infraction cachée n'est pas un flagrant délit." },
  { t:"apprehension", q:"Pendant l'attente de la police, la personne appréhendée :", o:[
    "Ne doit jamais rester seule et doit être maintenue dans des conditions dignes",
    "Peut être laissée seule dans un local fermé",
    "Peut être attachée à un point fixe",
    "Doit être interrogée par l'agent"], a:0,
    e:"La personne ne doit jamais rester seule, être protégée (agressions, destruction de preuves) et maintenue dignement (vouvoiement, respect de l'état physique). Ne jamais l'attacher à un point fixe." },

  /* ---------------- FILIÈRES MÉTIERS (UV06) ---------------- */

    "6 filières","4 filières","3 filières","8 filières"], a:0,
    e:"6 filières : Surveillance, Distribution, Télésurveillance, Incendie, Aéroportuaire et Nucléaire." },
  { t:"filieres", q:"À quelle filière appartiennent l'agent pré-vol et l'agent arrière-caisse ?", o:[
    "La Distribution","La Surveillance","L'Incendie","La Télésurveillance"], a:0,
    e:"Filière Distribution : prévention des vols et de la malveillance en magasin (surface de vente, vidéo, arrière-caisse)." },
  { t:"filieres", q:"Quelle filière concerne les ERP et les IGH ?", o:[
    "L'Incendie (notamment SSIAP)","La Surveillance","L'Aéroportuaire","Le Nucléaire"], a:0,
    e:"La filière Incendie couvre la prévention et la sécurité incendie en ERP/IGH et en milieu industriel, notamment les métiers SSIAP." },
  { t:"filieres", q:"À quelle filière le TFP APS prépare-t-il principalement ?", o:[
    "La Surveillance","La Distribution","L'Incendie","Le Nucléaire"], a:0,
    e:"Le TFP APS prépare principalement aux fondamentaux de la filière Surveillance, la plus généraliste. Il faut toutefois savoir reconnaître les autres filières." },
  { t:"filieres", q:"De quand date l'accord relatif aux qualifications professionnelles à retenir ?", o:[
    "Du 26 septembre 2016","Du 15 février 1985","Du 10 juillet 2012","Du 1er mai 2022"], a:0,
    e:"L'accord relatif aux qualifications professionnelles (26 septembre 2016) rattache les métiers repères à la Convention collective nationale des entreprises de prévention et de sécurité. Attention à la coquille « 2006 » du support." },
  { t:"filieres", q:"Le chef de poste dispose-t-il d'un pouvoir hiérarchique ?", o:[
    "Non : il coordonne, donne un avis et rend compte à sa hiérarchie",

    "Oui, il peut sanctionner les agents",
    "Oui, il remplace le directeur"], a:0,
    e:"Le chef de poste coordonne la bonne exécution de la prestation mais ne dispose PAS d'un pouvoir hiérarchique : il peut donner un avis et rend compte à sa hiérarchie." },
  { t:"filieres", q:"Pour l'agent cynophile, quel est le rôle du chien ?", o:[
    "Le chien est l'auxiliaire du conducteur",
    "Le chien est le supérieur de l'agent",
    "Le chien appartient au client",
    "Le chien remplace l'agent la nuit"], a:0,
    e:"L'agent cynophile forme une équipe Homme/Chien ; il est propriétaire du chien en règle. Le chien est l'auxiliaire du conducteur, pas l'inverse." },
  { t:"filieres", q:"Quelle est la mission clé de l'agent de sécurité filtrage ?", o:[
    "Empêcher l'introduction d'objets illicites dans une zone définie",
    "Faire des rondes de nuit",
    "Analyser les images radioscopiques",
    "Conduire un chien d'intervention"], a:0,
    e:"Le filtrage empêche l'introduction d'objets illicites dans une zone définie (hors zone de sûreté aéroportuaire), contrôle la concordance objet/convoyeur et lève le doute dans le respect des libertés publiques." },
  { t:"filieres", q:"Quelle est la mission clé de l'opérateur filtrage ?", o:[
    "Analyser les images radioscopiques et informations des appareils de contrôle",
    "Faire des rondes mobiles",
    "Diriger le poste de sécurité incendie",
    "Contrôler les pièces d'identité"], a:0,
    e:"L'opérateur filtrage assure l'analyse des informations des appareils de contrôle, notamment la visualisation des images radioscopiques." },
  { t:"filieres", q:"Que recouvre le métier de SSIAP 1 ?", o:[
    "Agent opérationnel : prévention, évacuation, assistance et exploitation du PC sécurité",
    "Chef d'équipe qui dirige le poste lors des sinistres",
    "Chef de service qui organise et conseille",
    "Conducteur de chien d'intervention"], a:0,
    e:"SSIAP 1 = agent : prévention des incendies, alerte, évacuation du public, assistance à personnes et exploitation du PC sécurité. SSIAP 2 encadre l'équipe, SSIAP 3 organise le service." },
  { t:"filieres", q:"L'agent pré-vol (inspecteur magasin) vérifie-t-il les pièces d'identité et moyens de paiement ?", o:[
    "Non, ce n'est pas son rôle",
    "Oui, systématiquement",
    "Oui, uniquement les mineurs",
    "Oui, à la demande de la caisse"], a:0,
    e:"L'agent pré-vol ne vérifie ni la pertinence des moyens de paiement ni les pièces d'identité. Il n'a pas l'uniforme obligatoire mais doit avoir sa carte professionnelle sur lui en cas de contrôle." },
  { t:"filieres", q:"Pour quel métier de la Distribution le port de l'uniforme est-il obligatoire ?", o:[
    "L'agent arrière-caisse","L'agent pré-vol","L'agent vidéo","Aucun"], a:0,
    e:"L'agent arrière-caisse est soumis au port obligatoire de l'uniforme. L'agent pré-vol, lui, n'y est pas soumis mais doit porter sa carte professionnelle." },
  { t:"filieres", q:"Quelle est la durée de la formation « Titre professionnel ASCCI » (agent cynophile) citée dans le support ?", o:[
    "315 heures","175 heures","70 heures","500 heures"], a:0,
    e:"Le support indique 315 heures pour le Titre professionnel Agent de sécurité conducteur de chien d'intervention (ASCCI)." },
  { t:"filieres", q:"Que protège l'Agent de sécurité Qualifié (ASQ) ?", o:[
    "Les biens meubles et immeubles et les personnes liées à la sécurité des biens",
    "Uniquement les personnes",
    "Uniquement la voie publique",
    "Uniquement les systèmes informatiques"], a:0,
    e:"L'ASQ protège les biens meubles et immeubles ainsi que les personnes physiques ou morales liées directement ou indirectement à la sécurité des biens. C'est le socle généraliste de la filière Surveillance." },

  /* ---------------- MODALITÉS D'APPRÉHENSION EN EXERCICE (UV06) ---------------- */
  { t:"modalites", q:"Quel est le réflexe central lors d'une appréhension en magasin ?", o:[
    "Ne pas confondre appréhension, contrôle et fouille",
    "Toujours fouiller la personne",
    "Toujours appeler la police",
    "Récupérer la marchandise par la force"], a:0,
    e:"L'agent constate, invite, sécurise et transmet ; il ne se substitue pas aux forces de l'ordre. Appréhension, contrôle et fouille ne doivent pas être confondus." },
  { t:"modalites", q:"À quelle condition l'appréhension peut-elle avoir lieu ?", o:[
    "Seulement si l'on est certain que l'acte délictueux a été commis",
    "Dès qu'un portique sonne",
    "Dès qu'une personne paraît suspecte",
    "Sur simple signalement d'un client"], a:0,
    e:"L'appréhension ne doit se faire que si l'on est certain que l'acte délictueux a été commis. La priorité est la sécurité des personnes, la maîtrise de la situation et la traçabilité." },
  { t:"modalites", q:"Peut-on obliger physiquement un client à suivre l'agent dans le local ?", o:[
    "Non : c'est interdit ; en cas de refus, dialoguer puis appeler la police",
    "Oui, par la contrainte si besoin",
    "Oui, s'il a volé",
    "Oui, en le tenant par le bras"], a:0,
    e:"Il est interdit d'obliger le client à suivre l'agent. En cas de refus : tenter le dialogue, puis appeler la police. Ne jamais transformer l'invitation en contrainte physique." },
  { t:"modalites", q:"Parmi ces actes, lequel est AUTORISÉ lors du contrôle ?", o:[
    "Le contrôle visuel (prévu par le règlement intérieur)",
    "La palpation",
    "La fouille des poches et sacs",
    "La contrainte pour obtenir une signature"], a:0,
    e:"Autorisé : contrôle visuel et demande de vider volontairement poches/sacs. Interdits : palpation, fouille, et toute contrainte pour obtenir papiers, signature ou déplacement." },
  { t:"modalites", q:"La remise de la pièce d'identité par la personne doit être :", o:[
    "Absolument volontaire","Exigée systématiquement","Obtenue par la fouille","Imposée aux mineurs"], a:0,
    e:"La remise de la pièce d'identité doit être absolument volontaire. Règle : demander, jamais arracher ; observer, jamais fouiller." },
  { t:"modalites", q:"Comment l'agent doit-il s'adresser à la personne appréhendée, y compris un mineur ?", o:[
    "Toujours la vouvoyer, quel que soit son âge",
    "La tutoyer si c'est un mineur",
    "Hausser le ton pour la calmer",
    "Employer les mots « vol » et « voleur »"], a:0,
    e:"Toujours vouvoyer, quel que soit l'âge, y compris un mineur. Insultes, menaces, coups et propos discriminants sont interdits ; éviter même les mots « vol » ou « voleur »." },
  { t:"modalites", q:"Un mineur peut-il signer la lettre-plainte simplifiée ?", o:[
    "Non, jamais : on fait signer une prise en charge par la personne civilement responsable",
    "Oui, s'il reconnaît les faits",
    "Oui, avec l'accord de l'agent",
    "Oui, s'il a plus de 13 ans"], a:0,
    e:"Ne jamais faire signer la lettre-plainte simplifiée par un mineur. On fait remplir et signer une prise en charge par la personne civilement responsable." },
  { t:"modalites", q:"À qui un enfant appréhendé peut-il être confié ?", o:[
    "À une personne juridiquement responsable (parent, grand-parent, frère/sœur majeur, tuteur légal)",
    "À n'importe quel adulte présent",
    "À un autre client du magasin",
    "À un agent de sécurité"], a:0,
    e:"L'enfant ne peut être confié qu'à une personne juridiquement responsable. En cas d'impossibilité : appel systématique aux forces de l'ordre." },
  { t:"modalites", q:"Quelle est la durée maximale de sauvegarde des images de vidéosurveillance en magasin ?", o:[
    "1 mois maximum (souvent 7 jours)",
    "1 an",
    "3 mois",
    "48 heures"], a:0,
    e:"Durée de sauvegarde : 1 mois maximum, souvent 7 jours. Le système doit être déclaré à la préfecture et le CSE informé ; le client n'est pas autorisé à voir directement ses images." },
  { t:"modalites", q:"Une personne appréhendée demande à aller aux toilettes. L'agent accède à la demande :", o:[
    "Si le trajet est sécurisé et si elle a accepté de restituer les objets dérobés",
    "Dans tous les cas, sans condition",
    "Jamais",
    "Seulement si elle a payé"], a:0,
    e:"On accède à la demande d'aller aux toilettes uniquement si le trajet est réalisable en sécurité et si la personne a accepté de restituer l'ensemble des objets dérobés." },
  { t:"modalites", q:"La lettre-plainte simplifiée pour vol s'utilise :", o:[
    "Quel que soit le montant du vol",
    "Seulement au-dessus d'un certain montant",
    "Seulement pour les majeurs",
    "Seulement si la police se déplace"], a:0,
    e:"La fiche de plainte simplifiée est un document officiel, à remplir avec soin (toutes les rubriques) et à utiliser quel que soit le montant du vol." },
  { t:"modalites", q:"Comment doit être rédigé le compte rendu de l'appréhension ?", o:[
    "De façon chronologique, factuelle et neutre, sans jugement",
    "Librement, selon le ressenti de l'agent",
    "En qualifiant la personne de « voleur »",
    "Uniquement à l'oral"], a:0,
    e:"Le compte rendu assure la traçabilité : chronologique (lieu, moment, observations, dialogue, objets, témoins, suites), factuel et neutre, sur le document propre au magasin." },
  { t:"modalites", q:"Combien de personnes faut-il prévoir, au minimum, pour sécuriser l'intervention ?", o:[
    "Au moins deux (un agent ou un cadre du magasin en appui)",
    "Une seule suffit",
    "Au moins quatre",
    "Toute l'équipe systématiquement"], a:0,
    e:"Prévoir au moins deux personnes : le second membre surveille les articles, prévient une fuite et contribue à la sécurité. Agent seul : appeler un responsable du magasin." },

  /* ---------------- TÉLÉSURVEILLANCE & VIDÉOPROTECTION (UV10) ---------------- */
  { t:"telesurv", q:"Quelles sont les deux finalités de la vidéoprotection ?", o:[
    "Dissuader les actes de malveillance et renforcer le sentiment de sécurité",
    "Identifier et sanctionner les clients",
    "Remplacer les agents de sécurité",
    "Contrôler le rendement des salariés"], a:0,
    e:"Les deux finalités : dissuader les actes de malveillance et renforcer le sentiment de sécurité. Le système protège les personnes et les biens." },
  { t:"telesurv", q:"À partir de combien de places un parking ouvert au public a-t-il une obligation de vidéoprotection ?", o:[
    "200 places (art. R.273-7 CSI)",
    "100 places",
    "500 places",
    "50 places"], a:0,
    e:"Les parkings ouverts au public d'au moins 200 places sont concernés par l'obligation (art. R.273-7 du Code de la sécurité intérieure)." },
  { t:"telesurv", q:"Pour un lieu OUVERT au public, quel est le régime applicable ?", o:[
    "Code de la sécurité intérieure (CSI) + autorisation préfectorale",
    "Loi Informatique et Libertés + Code du travail",
    "Code civil uniquement",
    "Aucune autorisation nécessaire"], a:0,
    e:"Le bon réflexe : lieu ouvert au public → CSI + Préfecture. Lieu NON ouvert au public (ex. bureaux) → loi Informatique et Libertés + Code du travail." },
  { t:"telesurv", q:"Une caméra en magasin doit filmer :", o:[
    "Un objet ou une zone précise (ex. la caisse, pas le caissier)",
    "L'ensemble du personnel en permanence",
    "Les zones de pause",
    "Les locaux syndicaux"], a:0,
    e:"Une caméra doit filmer une zone précise. Filmer un employé sur son poste est interdit (sauf cas justifié : caisse, stock de valeur) ; toilettes, zones de repos et locaux syndicaux : interdiction stricte." },
  { t:"telesurv", q:"Quelle est la première des 4 étapes d'un projet de vidéoprotection ?", o:[
    "La consultation des représentants du personnel",
    "L'installation du système",
    "La demande d'autorisation à la préfecture",
    "L'information individuelle des salariés"], a:0,
    e:"Ordre des 4 étapes : 1) consultation des représentants du personnel ; 2) autorisation préfectorale si lieu ouvert au public ; 3) information individuelle des personnes ; 4) installation." },
  { t:"telesurv", q:"À quelle fréquence l'autorisation de vidéoprotection doit-elle être renouvelée ?", o:[
    "Tous les 5 ans (et en cas de changement d'exploitant ou de modification)",
    "Tous les ans",
    "Tous les 10 ans",
    "Jamais, elle est définitive"], a:0,
    e:"Renouvellement tous les 5 ans, et également en cas de changement d'exploitant ou de modification du système." },
  { t:"telesurv", q:"Quelle est la durée maximale de conservation des images ?", o:[
    "1 mois","1 an","6 mois","48 heures"], a:0,
    e:"Durée maximale : 1 mois (en pratique quelques jours). Si une procédure est en cours, les images sont extraites, consignées et conservées le temps de la procédure." },
  { t:"telesurv", q:"Le registre de vidéoprotection est :", o:[
    "Obligatoire : il assure la traçabilité du cycle de vie des images",
    "Facultatif",
    "Réservé à la police",
    "Un simple cahier de consignes"], a:0,
    e:"Le registre est obligatoire. Il contient les renseignements généraux (dispositif, caméras, responsables) et les pages de suivi (enregistrement, destruction, transmission au Parquet)." },
  { t:"telesurv", q:"Dans la chaîne de télésurveillance, une alarme déclenchée :", o:[
    "N'est pas une preuve d'intrusion : elle entraîne une vérification (levée de doute)",
    "Prouve toujours une intrusion",
    "Autorise une intervention armée",
    "Dispense d'appeler les forces de l'ordre"], a:0,
    e:"Une alarme n'est pas une preuve d'intrusion : elle déclenche une analyse / levée de doute et une réponse proportionnée. Chaîne : détection → transmission → analyse → alerte/intervention." },
  { t:"telesurv", q:"À qui une personne filmée adresse-t-elle sa demande d'accès aux images ?", o:[
    "Au responsable du système, en précisant date, heure et lieu approximatif",
    "Directement à la CNIL dans tous les cas",
    "Au maire de la commune",
    "À n'importe quel agent de sécurité"], a:0,
    e:"La demande s'adresse au responsable du système (exploitant / responsable de traitement), avec des éléments précis (date, heure, lieu approximatif) pour retrouver la séquence." },
  { t:"telesurv", q:"Dans quel cas l'accès aux images peut-il être refusé ?", o:[
    "Atteinte à la vie privée de tiers, à la sûreté de l'État, à la sécurité publique ou à une enquête en cours",
    "Si la personne n'est pas cliente",
    "Si la demande est écrite",
    "Toujours, l'accès n'est jamais possible"], a:0,
    e:"Le refus peut être justifié pour protéger la vie privée des tiers, la sûreté de l'État, la défense, la sécurité publique ou une enquête judiciaire en cours." },
  { t:"telesurv", q:"En cas de refus d'accès, quelle est la voie de recours ?", o:[
    "Saisir la CNIL ou la commission départementale de vidéoprotection (préfecture)",
    "Porter plainte au commissariat",
    "Saisir le tribunal de commerce",
    "Aucun recours n'est possible"], a:0,
    e:"En cas de refus, on peut saisir la CNIL ou la commission départementale de vidéoprotection (préfecture) pour les systèmes autorisés au titre du CSI." },
  { t:"telesurv", q:"Quel article du Code de procédure pénale pose la liberté de la preuve ?", o:[
    "L'article 427","L'article 53","L'article 73","L'article 803"], a:0,
    e:"Article 427 CPP : liberté de la preuve ; le juge apprécie la loyauté et la pertinence. La preuve vidéo doit établir de façon fiable la date, l'heure et l'emplacement de la caméra." },
  { t:"telesurv", q:"Quel est le rôle du multiplexeur dans la chaîne de vidéoprotection ?", o:[
    "Gérer plusieurs caméras et l'affichage multi-écrans",
    "Enregistrer et supprimer les images",
    "Capter la scène",
    "Transmettre l'alarme aux forces de l'ordre"], a:0,
    e:"Trio à mémoriser : caméra = capter, multiplexeur = organiser (gère plusieurs caméras / multi-écrans), enregistreur = conserver (stockage et suppression automatique)." },

  /* ---------------- ACCUEIL & CONTRÔLE D'ACCÈS (UV08) ---------------- */
  { t:"accueil", q:"Que représentent l'accueil et le contrôle d'accès dans la chaîne de sécurité ?", o:[
    "Le premier maillon de la chaîne de sécurité",
    "Une tâche purement administrative",
    "Le dernier recours en cas d'intrusion",
    "Une mission réservée à la police"], a:0,
    e:"L'accueil et le contrôle d'accès sont le premier maillon de la chaîne de sécurité. L'APS y agit dans le cadre strict des consignes et ne dispose d'aucun pouvoir coercitif." },
  { t:"accueil", q:"Comment définit-on le contrôle d'accès ?", o:[
    "Subordonner l'entrée d'un site ou de locaux à une autorisation d'accès",
    "Fouiller toute personne qui entre",
    "Contrôler l'identité de chaque visiteur",

/* ---- Thème clair/sombre ---- */
const themeBtn = document.getElementById("themeBtn");
const themeLbl = document.getElementById("themeLbl");
function currentDark(){
  return document.documentElement.getAttribute("data-theme")==="dark";
}
function applyTheme(mode){
  document.documentElement.setAttribute("data-theme", mode);
  try{ localStorage.setItem("qcu_tfp_theme", mode); }catch(e){}
  syncThemeLabel();
}
function syncThemeLabel(){ if(themeLbl) themeLbl.textContent = currentDark() ? "Clair" : "Sombre"; }
themeBtn.addEventListener("click", ()=>{ applyTheme(currentDark() ? "light" : "dark"); });
// Par défaut : thème clair (blanc), ou le dernier choix mémorisé
let startTheme = "light";
try{ const saved = localStorage.getItem("qcu_tfp_theme"); if(saved==="dark"||saved==="light") startTheme = saved; }catch(e){}
applyTheme(startTheme);

/* ---- localStorage : meilleur score ---- */
function loadBest(key){ try{ return JSON.parse(localStorage.getItem(key||"qcu_tfp_best")||"{}"); }catch(e){ return {}; } }
function saveBest(o,key){ try{ localStorage.setItem(key||"qcu_tfp_best", JSON.stringify(o)); }catch(e){} }

/* ---- utilitaires ---- */
function shuffle(a){ a=a.slice(); for(let i=a.length-1;i>0;i--){ const j=Math.floor(Math.random()*(i+1)); [a[i],a[j]]=[a[j],a[i]]; } return a; }
function countFor(keys){ return BANK.filter(q=>keys.has(q.t)).length; }
function esc(s){ return s.replace(/[&<>]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;"}[c])); }

/* ===================== NAVIGATION ===================== */
const SECTION_LABELS = { train:"Entraînement", dl:"QCU Dates & Lois", revisions:"Révisions" };
const sectionLbl = document.getElementById("sectionLbl");
function setActiveNav(view){
  document.querySelectorAll(".drawer-item").forEach(t=>{
    if(t.dataset.view===view) t.setAttribute("aria-current","true");
    else t.removeAttribute("aria-current");
  });
  if(sectionLbl && SECTION_LABELS[view]) sectionLbl.textContent = SECTION_LABELS[view];
}
function navTo(view){
  if(view==="train") renderSetup();
  else if(view==="dl") renderDL();
  else if(view==="revisions") renderRevisions();
  window.scrollTo({top:0});
}

/* ---- Menu latéral (drawer) ---- */
const drawer = document.getElementById("drawer");
const drawerOverlay = document.getElementById("drawerOverlay");
const menuBtn = document.getElementById("menuBtn");
function openDrawer(){
  drawer.classList.add("open"); drawerOverlay.classList.add("open");
  drawer.setAttribute("aria-hidden","false"); menuBtn.setAttribute("aria-expanded","true");
}
function closeDrawer(){
  drawer.classList.remove("open"); drawerOverlay.classList.remove("open");
  drawer.setAttribute("aria-hidden","true"); menuBtn.setAttribute("aria-expanded","false");
}

/* ===================== ÉCRAN DE DÉPART ===================== */
function renderSetup(){
  progressRail.hidden = true;
  setActiveNav("train");
  const best = loadBest();

  // Groupes dépliables par UV
  const groups = UV_ORDER.map(uv=>{
    const keys = Object.keys(THEMES).filter(k=>THEMES[k].uv===uv);
    const selCount = keys.filter(k=>selected.has(k)).length;
    const qTotal = BANK.filter(q=>THEMES[q.t].uv===uv).length;
    const open = expandedUV.has(uv);
    const allOn = selCount===keys.length;

    const tiles = keys.map(key=>{
      const th = THEMES[key];
      const on = selected.has(key);
      const n = BANK.filter(q=>q.t===key).length;
      return `<button class="theme-tile" data-theme-key="${key}" aria-pressed="${on}">
        <div class="tt-top">
          <span class="uv">${n} questions</span>
          <span class="check"><svg viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="3.2" stroke-linecap="round" stroke-linejoin="round"><path d="M5 13l4 4L19 7"/></svg></span>
        </div>
        <div class="tt-name">${th.name}</div>
      </button>`;
    }).join("");

    return `<div class="uv-group">
      <button class="uv-head" data-uv="${uv}" aria-expanded="${open}">
        <span class="uv-chevron"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"><path d="M9 6l6 6-6 6"/></svg></span>
        <span class="uv-head-txt">
          <span class="uv-code">${uv} · ${UV_META[uv]?UV_META[uv].name:""}</span>
          <span class="uv-sub">${keys.length} thème${keys.length>1?"s":""} · ${selCount} sélectionné${selCount>1?"s":""}</span>
        </span>
        <span class="uv-badge ${selCount>0?"on":""}">${selCount}/${keys.length}</span>
      </button>
      <div class="uv-body" ${open?"":"hidden"}>
        <div class="uv-tools"><button class="uv-selectall" data-uv-all="${uv}">${allOn?"Tout retirer":"Tout sélectionner"}</button></div>
        ${tiles}
      </div>
    </div>`;
  }).join("");

  const avail = countFor(selected);
  const counts = [10,20,50,100,"max"];
  const pills = counts.map(c=>{
    const val = c==="max"?avail:c;
    const label = c==="max"?"Tout":c;
    const on = (c==="max" && qCount>=avail) || qCount===c;
    const disabled = (typeof c==="number" && c>avail);
    return `<button class="pill" data-count="${c}" aria-pressed="${on}" ${disabled?"disabled style='opacity:.4'":""}>${label}</button>`;
  }).join("");

  app.innerHTML = `
    <section class="setup">
      <div class="intro">
        <span class="eyebrow">Révision · examen blanc</span>
        <h1>Entraînement QCU</h1>
        <p>Une seule bonne réponse par question. Choisissez vos thèmes, lancez une série et obtenez une correction détaillée à la fin. Questions tirées de vos fiches de révision CFPS.</p>
      </div>

      <div>
        <div class="section-label">1 · Thèmes à réviser</div>
        <div class="uv-list" id="uvList">${groups}</div>
      </div>

      <div>
        <div class="section-label">2 · Nombre de questions</div>
        <div class="pills" id="countPills">${pills}</div>
      </div>

      <div class="card" style="padding:4px 16px">
        <div class="toggle-row">
          <div>
            <div style="font-weight:600">Mélanger l'ordre des réponses</div>
            <div class="muted" style="font-size:.84rem">Évite de retenir la position de la bonne réponse</div>
          </div>
          <label class="switch"><input type="checkbox" id="shuffleOpt" ${shuffleOpts?"checked":""}><span class="slider"></span></label>
        </div>
      </div>

      <div>
        <button class="start-btn" id="startBtn">
          Commencer · <span class="tnum" id="startCount">${Math.min(qCount,avail)}</span> questions
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12h14M13 6l6 6-6 6"/></svg>
        </button>
        ${best.last!=null?`<div class="best" style="margin-top:12px"><svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 2l2.4 7.4H22l-6 4.6 2.3 7.4L12 17l-6.3 4.4L8 14 2 9.4h7.6z"/></svg> Meilleur score : <b class="tnum">&nbsp;${best.best}%</b></div>`:""}
      </div>

      <button class="ref-btn" id="refBtn">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 19.5A2.5 2.5 0 0 1 6.5 17H20"/><path d="M6.5 2H20v20H6.5A2.5 2.5 0 0 1 4 19.5v-15A2.5 2.5 0 0 1 6.5 2z"/></svg>
        <span><b>Consulter les textes de loi</b><small>Tous les articles &amp; dates à mémoriser</small></span>
        <svg class="chev" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M9 6l6 6-6 6"/></svg>
      </button>

      <p class="footer-note">TFP APS — Agent de prévention et de sécurité · UV02 (juridique) · UV05 (incendie) · UV06 (métiers) · UV10 (télésurveillance).<br>Support de révision, ne remplace pas les textes officiels ni le cours complet.</p>
    </section>`;

  // déplier / replier un UV
  app.querySelectorAll("[data-uv]").forEach(btn=>{
    btn.addEventListener("click", ()=>{
      const uv = btn.dataset.uv;
      if(expandedUV.has(uv)) expandedUV.delete(uv); else expandedUV.add(uv);
      renderSetup();
    });
  });
  // tout sélectionner / retirer dans un UV
  app.querySelectorAll("[data-uv-all]").forEach(btn=>{
    btn.addEventListener("click", (e)=>{
      e.stopPropagation();

      const keys = Object.keys(THEMES).filter(k=>THEMES[k].uv===uv);
      const allOn = keys.every(k=>selected.has(k));
      if(allOn){
        // ne pas tout vider globalement
        const remaining = [...selected].filter(k=>!keys.includes(k));
        if(remaining.length>=1) keys.forEach(k=>selected.delete(k));
      } else {
        keys.forEach(k=>selected.add(k));
      }
      expandedUV.add(uv);
      renderSetup();
    });
  });
  // interactions thèmes
  app.querySelectorAll("[data-theme-key]").forEach(btn=>{
    btn.addEventListener("click", ()=>{
      const k = btn.dataset.themeKey;
      if(selected.has(k)){ if(selected.size>1) selected.delete(k); }
      else selected.add(k);
      renderSetup();
    });
  });
  // interactions count
  app.querySelectorAll("[data-count]").forEach(btn=>{
    btn.addEventListener("click", ()=>{
      const c = btn.dataset.count;
      qCount = c==="max" ? countFor(selected) : Number(c);
      renderSetup();
    });
  });

  document.getElementById("refBtn").addEventListener("click", ()=>{ renderReference(); window.scrollTo({top:0}); });
}

/* ===================== LANCEMENT DU QUIZ ===================== */
// Moteur générique : lance une série à partir d'un pool de questions
function startSession(pool, opts){
  const n = Math.min(opts.count||pool.length, pool.length);
  const chosen = shuffle(pool).slice(0, n).map(q=>{
    let o = q.o.map((text,i)=>({text, correct:i===q.a}));
    if(shuffleOpts) o = shuffle(o);
    return { ...q, opts:o };
  });
  session = {
    questions:chosen, idx:0, answers:[],
    bestKey: opts.bestKey || "qcu_tfp_best",
    backTo: opts.backTo || renderSetup,
    restart: opts.restart || startQuiz,
  };
  progressRail.hidden = false;
  renderQuestion();
}
function startQuiz(){
  const pool = BANK.filter(q=>selected.has(q.t));
  startSession(pool, { count:qCount, bestKey:"qcu_tfp_best", backTo:renderSetup, restart:startQuiz });
}

/* ===================== UNE QUESTION ===================== */
function renderQuestion(){
  const s = session;
  const q = s.questions[s.idx];
  const th = THEMES[q.t] || { uv:q.uv||"", short:q.cat||"Dates & Lois" };
  progressFill.style.width = ((s.idx)/s.questions.length*100)+"%";

  const opts = q.opts.map((o,i)=>{
    const L = String.fromCharCode(65+i);
    return `<button class="opt" data-opt="${i}">
      <span class="letter">${L}</span>
      <span class="otxt">${esc(o.text)}</span>
      <svg class="mark" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path class="m-ok" d="M5 13l4 4L19 7"/></svg>
    </button>`;
  }).join("");

  app.innerHTML = `
    <section class="quiz">
      <div class="q-meta">
        <span class="q-tag">
          <svg width="13" height="13" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><circle cx="12" cy="12" r="9" fill="none" stroke="currentColor" stroke-width="2"/><circle cx="12" cy="12" r="3.2"/></svg>
          ${th.uv?th.uv+" · ":""}${th.short}
        </span>
        <span class="q-counter tnum">Question ${s.idx+1} / ${s.questions.length}</span>
      </div>

      <div class="card q-card">
        <p class="q-text">${esc(q.q)}</p>
        <p class="q-hint">Sélectionnez la bonne réponse.</p>
        <div class="options" id="options">${opts}</div>
        <div id="feedback"></div>
      </div>

      <button class="quit-link" id="quitBtn">Abandonner la série</button>
    </section>`;

  const optButtons = app.querySelectorAll(".opt");
  optButtons.forEach(btn=>{
    btn.addEventListener("click", ()=>answer(Number(btn.dataset.opt)));
  });
  document.getElementById("quitBtn").addEventListener("click", ()=>{
    if(session.answers.length===0){ (session.backTo||renderSetup)(); }
    else finish();
  });
}

function answer(chosenIdx){
  const s = session;
  const q = s.questions[s.idx];
  const optButtons = app.querySelectorAll(".opt");
  const correctIdx = q.opts.findIndex(o=>o.correct);
  const isCorrect = chosenIdx===correctIdx;

  optButtons.forEach((btn,i)=>{
    btn.disabled = true;
    if(i===correctIdx) btn.classList.add("correct");
    else if(i===chosenIdx) btn.classList.add("wrong");
    else btn.classList.add("dim");
  });

  s.answers.push({ q, chosenIdx, correctIdx, isCorrect });

  const fb = document.getElementById("feedback");
  const last = s.idx===s.questions.length-1;
  fb.innerHTML = `
    <div class="explain ${isCorrect?"ok":"ko"}">
      <div class="ex-head">
        ${isCorrect
          ? `<svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10" stroke-width="2"/><path d="M8 12l2.5 2.5L16 9"/></svg> Bonne réponse`
          : `<svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10" stroke-width="2"/><path d="M15 9l-6 6M9 9l6 6"/></svg> Réponse incorrecte`}
      </div>
      <div>${esc(q.e)}</div>
    </div>
    <button class="next-btn" id="nextBtn" style="margin-top:14px">
      ${last?"Voir mon résultat":"Question suivante"}
      <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12h14M13 6l6 6-6 6"/></svg>
    </button>`;

  progressFill.style.width = ((s.idx+1)/s.questions.length*100)+"%";
  const nb = document.getElementById("nextBtn");
  nb.addEventListener("click", ()=>{
    if(last){ finish(); }
    else { s.idx++; renderQuestion(); window.scrollTo({top:0, behavior:"smooth"}); }
  });
  nb.focus();
}

/* ===================== RÉSULTATS ===================== */
function finish(){
  progressRail.hidden = true;
  const s = session;
  const total = s.answers.length;
  const good = s.answers.filter(a=>a.isCorrect).length;
  const pct = total? Math.round(good/total*100) : 0;
  const pass = pct>=70;

  // meilleur score (par mode)
  const bestKey = s.bestKey || "qcu_tfp_best";
  const best = loadBest(bestKey);
  const newBest = Math.max(best.best||0, pct);
  saveBest({ best:newBest, last:pct }, bestKey);

  // ventilation par thème
  const byTheme = {};
  s.answers.forEach(a=>{
    const k=a.q.t;
    byTheme[k] = byTheme[k] || {good:0,total:0};
    byTheme[k].total++; if(a.isCorrect) byTheme[k].good++;
  });
  const bdRows = Object.entries(byTheme).map(([k,v])=>{
    const p = Math.round(v.good/v.total*100);
    const label = THEMES[k] ? THEMES[k].short : "Dates & Lois";
    return `<div class="bd-row">
      <span class="bd-name">${label}</span>
      <span class="bd-bar"><i style="width:${p}%"></i></span>
      <span class="bd-score tnum">${v.good}/${v.total}</span>
    </div>`;
  }).join("");

  // anneau
  const R=66, C=2*Math.PI*R, off=C*(1-pct/100);

  const reviewCards = s.answers.map((a,i)=>{
    const correctText = a.q.opts[a.correctIdx].text;
    const chosenText = a.q.opts[a.chosenIdx].text;
    return `<div class="card rv-card">
      <p class="rv-q">
        <span class="ic">${a.isCorrect
          ? `<svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="var(--good)" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10" stroke-width="2"/><path d="M8 12l2.5 2.5L16 9"/></svg>`
          : `<svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="var(--bad)" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10" stroke-width="2"/><path d="M15 9l-6 6M9 9l6 6"/></svg>`}
        </span>
        <span>${i+1}. ${esc(a.q.q)}</span>
      </p>
      ${!a.isCorrect?`<div class="rv-line bad"><span class="lab">Votre choix</span><span class="val">${esc(chosenText)}</span></div>`:""}
      <div class="rv-line good"><span class="lab">Réponse</span><span class="val">${esc(correctText)}</span></div>
      <div class="rv-exp">${esc(a.q.e)}</div>
    </div>`;
  }).join("");

  app.innerHTML = `
    <section class="results">
      <div class="card score-card">
        <span class="eyebrow">Résultat de la série</span>
        <div class="ring">
          <svg width="150" height="150" viewBox="0 0 150 150">
            <circle cx="75" cy="75" r="${R}" fill="none" stroke="var(--line)" stroke-width="12"/>
            <circle cx="75" cy="75" r="${R}" fill="none" stroke="${pass?"var(--good)":"var(--flame)"}" stroke-width="12" stroke-linecap="round" stroke-dasharray="${C}" stroke-dashoffset="${off}"/>
          </svg>
          <div class="pct"><b class="tnum">${pct}%</b><span>${good}/${total} bonnes</span></div>
        </div>
        <div class="verdict ${pass?"pass":"fail"}">${pass?"Objectif atteint":"À retravailler"}</div>
        <div class="score-sub">${pass?"Vous dépassez le seuil des 70 %. Continuez à varier les thèmes.":"Visez au moins 70 %. Revoyez la correction ci-dessous."}</div>
      </div>

      <div class="card breakdown">
        <div class="section-label" style="margin-bottom:4px">Par thème</div>
        ${bdRows}
      </div>

      <div class="actions">
        <button class="start-btn" id="againBtn">
          Nouvelle série
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M3 12a9 9 0 1 0 3-6.7L3 8"/><path d="M3 3v5h5"/></svg>
        </button>
        <button class="next-btn" id="homeBtn" style="background:var(--surface-2);color:var(--ink);border:1px solid var(--line)">Retour aux réglages</button>
      </div>

      <h2 class="rv-title">Correction détaillée</h2>
      <div class="review">${reviewCards}</div>

      <button class="next-btn" id="homeBtn2" style="background:var(--surface-2);color:var(--ink);border:1px solid var(--line);margin-top:4px">Retour aux réglages</button>
    </section>`;

  const restart = s.restart || startQuiz;
  const backTo = s.backTo || renderSetup;
  document.getElementById("againBtn").addEventListener("click", ()=>{ restart(); window.scrollTo({top:0}); });
  const home = ()=>{ backTo(); window.scrollTo({top:0}); };
  document.getElementById("homeBtn").addEventListener("click", home);
  document.getElementById("homeBtn2").addEventListener("click", home);
  window.scrollTo({top:0, behavior:"smooth"});
}

const LAW_ORDER = [
  "Code de procédure pénale",

  "Code de la sécurité intérieure (Livre VI & déontologie)",

  "Code pénal — autorité de l'État & justice",
  "Code civil",
];
const ORDERED_LAWS = LAW_ORDER.map(name=>LAWS.find(g=>g.g===name)).filter(Boolean)
  .concat(LAWS.filter(g=>!LAW_ORDER.includes(g.g)));

function buildLawGroups(filter){
  const q = (filter||"").trim().toLowerCase();
  const m = (it)=> !q || (it.ref+" "+it.t+" "+it.n).toLowerCase().includes(q);
  return ORDERED_LAWS.map(grp=>{
    const rows = grp.items.filter(m);
    if(!rows.length) return "";
    const p = PRIO[grp.g]||3;
    return `<div class="law-group">
      <div class="law-gtitle">
        <span class="pbadge p${p}">${PRIO_LABEL[p]}</span>
        ${esc(grp.g)}
        <span class="law-gcount">${rows.length}</span>
      </div>
      ${rows.map(it=>`<div class="law-row"><span class="law-ref">${esc(it.ref)}</span><span class="law-body"><span class="law-title">${esc(it.t)}</span><span class="law-note">${esc(it.n)}</span></span></div>`).join("")}
    </div>`;
  }).join("");
}
