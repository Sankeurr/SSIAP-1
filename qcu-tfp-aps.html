<meta name="claude:viewport-fit-sides" content="cover">
<title>QCU TFP APS</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wght@500;700;800&family=Source+Sans+3:wght@400;600;700&display=swap">
<style>
  /* Layout : écran de révision centré, une colonne ; bandeau sticky + cartes de question */
  :root{
    --bg:#eef1f5;
    --surface:#ffffff;
    --surface-2:#f4f6fa;
    --ink:#131a26;
    --ink-soft:#4a566b;
    --line:#d9dfe9;
    --navy:#152439;
    --navy-ink:#f3f6fb;
    --flame:#d8352a;
    --flame-soft:#fbe7e5;
    --good:#1f8a4c;
    --good-soft:#e3f4ea;
    --bad:#c22f28;
    --bad-soft:#fbe6e4;
    --accent:#2f6fd0;
    --shadow:0 1px 2px rgba(19,26,38,.06), 0 8px 24px rgba(19,26,38,.07);
    color-scheme:light;
  }
  @media (prefers-color-scheme:dark){
    :root:not([data-theme="light"]){
      --bg:#0c1118;
      --surface:#141c28;
      --surface-2:#1b2535;
      --ink:#e9eef6;
      --ink-soft:#9aa7bd;
      --line:#2a3647;
      --navy:#0f1a2b;
      --navy-ink:#eef3fb;
      --flame:#f06a5f;
      --flame-soft:#38211f;
      --good:#56c98a;
      --good-soft:#15291e;
      --bad:#f0837b;
      --bad-soft:#331a19;
      --accent:#6fa6f0;
      --shadow:0 1px 2px rgba(0,0,0,.4), 0 10px 28px rgba(0,0,0,.5);
      color-scheme:dark;
    }
  }
  :root[data-theme="dark"]{
    --bg:#0c1118;
    --surface:#141c28;
    --surface-2:#1b2535;
    --ink:#e9eef6;
    --ink-soft:#9aa7bd;
    --line:#2a3647;
    --navy:#0f1a2b;
    --navy-ink:#eef3fb;
    --flame:#f06a5f;
    --flame-soft:#38211f;
    --good:#56c98a;
    --good-soft:#15291e;
    --bad:#f0837b;
    --bad-soft:#331a19;
    --accent:#6fa6f0;
    --shadow:0 1px 2px rgba(0,0,0,.4), 0 10px 28px rgba(0,0,0,.5);
    color-scheme:dark;
  }

  *{box-sizing:border-box}
  body{
    background:var(--bg);
    color:var(--ink);
    font-family:"Source Sans 3", ui-sans-serif, system-ui, -apple-system, "Segoe UI", sans-serif;
    line-height:1.5;
    -webkit-font-smoothing:antialiased;
  }
  h1,h2,h3,.display{font-family:"Archivo", ui-sans-serif, system-ui, sans-serif}
  .tnum{font-variant-numeric:tabular-nums}

  .wrap{
    max-width:720px;
    margin:0 auto;
    padding-left:max(16px, env(safe-area-inset-left,0px));
    padding-right:max(16px, env(safe-area-inset-right,0px));
    padding-block:0 48px;
  }

  /* ---- Header ---- */
  header.top{
    background:var(--navy);
    color:var(--navy-ink);
    position:sticky;
    top:env(safe-area-inset-top,0px);
    z-index:20;
    border-bottom:1px solid rgba(255,255,255,.08);
  }
  body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:21;background:var(--navy)}
  .top-inner{
    max-width:720px;margin:0 auto;
    padding-left:max(16px, env(safe-area-inset-left,0px));
    padding-right:max(16px, env(safe-area-inset-right,0px));
    padding-block:12px;
    display:flex;align-items:center;gap:12px;
  }
  .brand{display:flex;align-items:center;gap:10px;min-width:0}
  .flame{flex:none;width:30px;height:30px}
  .brand .t1{font-family:"Archivo";font-weight:800;font-size:1.05rem;letter-spacing:.02em;line-height:1}
  .brand .t2{font-size:.72rem;color:#aebbd0;letter-spacing:.14em;text-transform:uppercase;margin-top:3px}
  .top-spacer{flex:1}
  .ghost-btn{
    flex:none;background:rgba(255,255,255,.08);color:var(--navy-ink);
    border:1px solid rgba(255,255,255,.16);border-radius:9px;
    padding:7px 10px;font-size:.82rem;cursor:pointer;font-family:inherit;
    display:inline-flex;align-items:center;gap:6px;
  }
  .ghost-btn:hover{background:rgba(255,255,255,.15)}

  /* progress bar under header during quiz */
  .progress-rail{height:4px;background:rgba(255,255,255,.12);width:100%}
  .progress-fill{height:100%;background:var(--flame);width:0;transition:width .3s ease}

  /* ---- generic ---- */
  .card{background:var(--surface);border:1px solid var(--line);border-radius:16px;box-shadow:var(--shadow)}
  .eyebrow{font-size:.72rem;letter-spacing:.16em;text-transform:uppercase;color:var(--flame);font-weight:700}
  .muted{color:var(--ink-soft)}
  button{font-family:inherit}

  /* ---- Setup screen ---- */
  .setup{margin-top:24px;display:flex;flex-direction:column;gap:18px}
  .intro h1{font-size:1.7rem;line-height:1.1;margin:.4rem 0 .5rem;text-wrap:balance}
  .intro p{margin:0;color:var(--ink-soft);max-width:60ch}

  .section-label{font-size:.8rem;font-weight:700;letter-spacing:.04em;color:var(--ink-soft);text-transform:uppercase;margin-bottom:2px}

  .theme-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
  @media (max-width:460px){.theme-grid{grid-template-columns:1fr}}
  .theme-tile{
    display:flex;flex-direction:column;gap:3px;text-align:left;
    background:var(--surface);border:1.5px solid var(--line);border-radius:13px;
    padding:13px 14px;cursor:pointer;position:relative;transition:border-color .15s, background .15s;
  }
  .theme-tile:hover{border-color:var(--accent)}
  .theme-tile[aria-pressed="true"]{border-color:var(--flame);background:var(--flame-soft)}
  .theme-tile .tt-top{display:flex;align-items:center;justify-content:space-between;gap:8px}
  .theme-tile .uv{font-size:.68rem;font-weight:800;letter-spacing:.08em;color:var(--flame);text-transform:uppercase}
  .theme-tile .tt-name{font-family:"Archivo";font-weight:700;font-size:1.02rem;line-height:1.15}
  .theme-tile .count{font-size:.78rem;color:var(--ink-soft)}
  .check{width:20px;height:20px;border-radius:50%;border:1.5px solid var(--line);flex:none;display:grid;place-items:center}
  .theme-tile[aria-pressed="true"] .check{background:var(--flame);border-color:var(--flame)}
  .check svg{width:12px;height:12px;opacity:0}
  .theme-tile[aria-pressed="true"] .check svg{opacity:1}

  /* ---- Accordéon par UV ---- */
  .uv-list{display:flex;flex-direction:column;gap:10px}
  .uv-group{border:1.5px solid var(--line);border-radius:14px;overflow:hidden;background:var(--surface)}
  .uv-head{width:100%;display:flex;align-items:center;gap:12px;padding:14px 15px;background:none;border:none;cursor:pointer;text-align:left;color:var(--ink)}
  .uv-head:hover{background:var(--surface-2)}
  .uv-chevron{flex:none;transition:transform .2s ease;color:var(--flame);display:grid;place-items:center}
  .uv-head[aria-expanded="true"] .uv-chevron{transform:rotate(90deg)}
  .uv-head-txt{flex:1;min-width:0}
  .uv-code{font-family:"Archivo";font-weight:700;font-size:1.04rem;line-height:1.15}
  .uv-sub{font-size:.8rem;color:var(--ink-soft);margin-top:2px}
  .uv-badge{flex:none;font-size:.74rem;font-weight:700;background:var(--surface-2);border:1px solid var(--line);color:var(--ink-soft);border-radius:999px;padding:3px 10px;font-variant-numeric:tabular-nums}
  .uv-badge.on{background:var(--flame);border-color:var(--flame);color:#fff}
  .uv-body{display:flex;flex-direction:column;gap:9px;padding:0 12px 14px;border-top:1px solid var(--line)}
  .uv-tools{display:flex;justify-content:flex-end;padding-top:10px}
  .uv-selectall{background:none;border:none;color:var(--accent);font-size:.82rem;font-weight:600;cursor:pointer;padding:4px 2px;font-family:inherit}
  .uv-selectall:hover{text-decoration:underline}

  .pills{display:flex;flex-wrap:wrap;gap:8px}
  .pill{
    background:var(--surface);border:1.5px solid var(--line);border-radius:999px;
    padding:8px 15px;font-size:.9rem;cursor:pointer;color:var(--ink);
    font-variant-numeric:tabular-nums;transition:border-color .15s, background .15s;
  }
  .pill[aria-pressed="true"]{border-color:var(--flame);background:var(--flame);color:#fff}
  :root[data-theme="dark"] .pill[aria-pressed="true"],
  @media (prefers-color-scheme:dark){:root:not([data-theme="light"]) .pill[aria-pressed="true"]{color:#0c1118}}

  .toggle-row{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:12px 2px}
  .switch{position:relative;width:46px;height:26px;flex:none}
  .switch input{position:absolute;opacity:0;width:100%;height:100%;margin:0;cursor:pointer}
  .slider{position:absolute;inset:0;background:var(--line);border-radius:999px;transition:background .15s}
  .slider::before{content:"";position:absolute;width:20px;height:20px;left:3px;top:3px;background:#fff;border-radius:50%;transition:transform .15s;box-shadow:0 1px 3px rgba(0,0,0,.3)}
  .switch input:checked + .slider{background:var(--flame)}
  .switch input:checked + .slider::before{transform:translateX(20px)}

  .start-btn{
    width:100%;background:var(--flame);color:#fff;border:none;border-radius:13px;
    padding:16px;font-size:1.08rem;font-weight:700;font-family:"Archivo";cursor:pointer;
    display:flex;align-items:center;justify-content:center;gap:10px;letter-spacing:.01em;
  }
  .start-btn:disabled{opacity:.45;cursor:not-allowed}
  .start-btn:not(:disabled):hover{filter:brightness(1.05)}

  .best{display:flex;align-items:center;gap:8px;font-size:.85rem;color:var(--ink-soft);justify-content:center}

  /* ---- Quiz screen ---- */
  .quiz{margin-top:20px;display:flex;flex-direction:column;gap:16px}
  .q-meta{display:flex;align-items:center;justify-content:space-between;gap:10px;font-size:.82rem}
  .q-tag{display:inline-flex;align-items:center;gap:6px;background:var(--surface-2);border:1px solid var(--line);border-radius:999px;padding:4px 11px;font-weight:600;color:var(--ink-soft)}
  .q-counter{color:var(--ink-soft);font-weight:600}
  .q-card{padding:20px}
  .q-text{font-family:"Archivo";font-weight:700;font-size:1.22rem;line-height:1.3;margin:0 0 4px;text-wrap:balance}
  .q-hint{font-size:.8rem;color:var(--ink-soft);margin-bottom:14px}
  .options{display:flex;flex-direction:column;gap:10px;margin-top:10px}
  .opt{
    display:flex;align-items:flex-start;gap:12px;width:100%;text-align:left;
    background:var(--surface);border:1.5px solid var(--line);border-radius:12px;
    padding:13px 14px;cursor:pointer;font-size:1rem;color:var(--ink);transition:border-color .12s, background .12s;
  }
  .opt:not(:disabled):hover{border-color:var(--accent)}
  .opt .letter{
    flex:none;width:26px;height:26px;border-radius:7px;background:var(--surface-2);
    border:1px solid var(--line);display:grid;place-items:center;font-weight:700;font-size:.85rem;font-family:"Archivo";
  }
  .opt .otxt{flex:1;min-width:0;padding-top:2px}
  .opt .mark{flex:none;width:22px;height:22px;opacity:0;transition:opacity .15s}
  .opt.correct{border-color:var(--good);background:var(--good-soft)}
  .opt.correct .letter{background:var(--good);border-color:var(--good);color:#fff}
  .opt.correct .mark{opacity:1;color:var(--good)}
  .opt.wrong{border-color:var(--bad);background:var(--bad-soft)}
  .opt.wrong .letter{background:var(--bad);border-color:var(--bad);color:#fff}
  .opt.wrong .mark{opacity:1;color:var(--bad)}
  .opt:disabled{cursor:default}
  .opt.dim{opacity:.6}

  .explain{
    margin-top:14px;border-left:3px solid var(--accent);background:var(--surface-2);
    border-radius:0 10px 10px 0;padding:12px 14px;font-size:.92rem;
  }
  .explain .ex-head{font-weight:700;font-family:"Archivo";margin-bottom:3px;display:flex;align-items:center;gap:7px}
  .explain.ok .ex-head{color:var(--good)}
  .explain.ko .ex-head{color:var(--bad)}
  .explain.ok{border-left-color:var(--good)}
  .explain.ko{border-left-color:var(--bad)}

  .next-btn{
    width:100%;background:var(--navy);color:var(--navy-ink);border:none;border-radius:12px;
    padding:14px;font-size:1rem;font-weight:700;font-family:"Archivo";cursor:pointer;
    display:flex;align-items:center;justify-content:center;gap:9px;
  }
  .next-btn:hover{filter:brightness(1.12)}
  .quit-link{background:none;border:none;color:var(--ink-soft);font-size:.85rem;cursor:pointer;text-decoration:underline;padding:6px;align-self:center}

  /* ---- Results ---- */
  .results{margin-top:24px;display:flex;flex-direction:column;gap:16px}
  .score-card{padding:26px 20px;text-align:center;display:flex;flex-direction:column;align-items:center;gap:6px}
  .ring{position:relative;width:150px;height:150px;margin:4px 0}
  .ring svg{transform:rotate(-90deg)}
  .ring .pct{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center}
  .ring .pct b{font-family:"Archivo";font-size:2.3rem;line-height:1;font-variant-numeric:tabular-nums}
  .ring .pct span{font-size:.8rem;color:var(--ink-soft)}
  .verdict{font-family:"Archivo";font-weight:800;font-size:1.3rem;margin-top:4px}
  .verdict.pass{color:var(--good)}
  .verdict.fail{color:var(--flame)}
  .score-sub{color:var(--ink-soft);font-size:.95rem}
  .breakdown{display:flex;flex-direction:column;gap:9px;padding:16px 18px}
  .bd-row{display:flex;align-items:center;gap:12px;font-size:.9rem}
  .bd-row .bd-name{flex:1;min-width:0}
  .bd-bar{flex:none;width:90px;height:7px;border-radius:999px;background:var(--surface-2);overflow:hidden}
  .bd-bar i{display:block;height:100%;background:var(--accent);border-radius:999px}
  .bd-score{flex:none;font-variant-numeric:tabular-nums;font-weight:700;width:46px;text-align:right}

  .review{display:flex;flex-direction:column;gap:12px}
  .rv-title{font-family:"Archivo";font-weight:800;font-size:1.1rem;margin:8px 2px 0}
  .rv-card{padding:15px 16px}
  .rv-q{font-weight:700;font-family:"Archivo";font-size:1rem;margin:0 0 9px;display:flex;gap:9px}
  .rv-q .ic{flex:none;margin-top:2px}
  .rv-line{font-size:.9rem;display:flex;gap:7px;padding:2px 0}
  .rv-line .lab{flex:none;font-weight:700;width:68px;color:var(--ink-soft)}
  .rv-line.good .val{color:var(--good);font-weight:600}
  .rv-line.bad .val{color:var(--bad);font-weight:600}
  .rv-exp{font-size:.86rem;color:var(--ink-soft);margin-top:7px;padding-top:7px;border-top:1px dashed var(--line)}

  .actions{display:flex;flex-direction:column;gap:10px;margin-top:6px}
  .footer-note{margin-top:30px;font-size:.78rem;color:var(--ink-soft);text-align:center;line-height:1.6}

  :focus-visible{outline:2.5px solid var(--accent);outline-offset:2px}
  @media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>

<header class="top">
  <div class="top-inner">
    <div class="brand">
      <svg class="flame" viewBox="0 0 24 24" aria-hidden="true"><path fill="#d8352a" d="M13.5 1.5c.4 3-1.2 4.6-2.8 6.1C9 9.2 7.3 10.9 7.3 13.7a6.7 6.7 0 0 0 13.4.2c0-2-.9-3.8-1.8-5-.2 1.1-.9 1.9-1.8 2.1.6-2.4-.3-5-2-6.8-.6-.6-1.2-1.2-1.6-2.7Z"/><path fill="#f6a01e" d="M12.4 10.3c.3 1.6-.7 2.5-1.5 3.3-.7.7-1.5 1.5-1.5 2.9a3.2 3.2 0 0 0 6.4.1c0-1.4-.9-2.5-1.6-3.3-.2.6-.6 1-1.1 1.1.4-1.3-.1-2.7-1.1-4.1Z"/></svg>
      <div>
        <div class="t1">QCU TFP APS</div>
        <div class="t2">Agent de prévention et de sécurité</div>
      </div>
    </div>
    <div class="top-spacer"></div>
    <button class="ghost-btn" id="themeBtn" aria-label="Basculer le thème clair/sombre">
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>
      <span id="themeLbl">Sombre</span>
    </button>
  </div>
  <div class="progress-rail" id="progressRail" hidden><div class="progress-fill" id="progressFill"></div></div>
</header>

<main class="wrap" id="app"></main>

<script>
/* ===================== BANQUE DE QUESTIONS ===================== *
 * Issues des fiches de révision CFPS fournies.
 * Chaque question : une seule bonne réponse (QCU).
 * answer = index de la bonne réponse dans options (avant mélange).
 * ============================================================== */
const THEMES = {
  incendie:   { uv:"UV05", name:"Incendie", short:"Incendie" },
  republique: { uv:"UV02", name:"Principes de la République", short:"République" },
  penal:      { uv:"UV02", name:"Code pénal", short:"Code pénal" },
  livre6:     { uv:"UV02", name:"Livre VI · CNAPS · Carte pro", short:"Livre VI" },
  deonto:     { uv:"UV02", name:"Code de déontologie", short:"Déontologie" },
  libertes:   { uv:"UV02", name:"Respect des libertés publiques", short:"Libertés publiques" },
  apprehension:{ uv:"UV02", name:"Conditions d'appréhension", short:"Appréhension" },
  filieres:   { uv:"UV06", name:"Filières métiers", short:"Filières métiers" },
  modalites:  { uv:"UV06", name:"Modalités d'appréhension (en exercice)", short:"Appréhension (exercice)" },
};

const BANK = [
  /* ---------------- INCENDIE (UV05) ---------------- */
  { t:"incendie", q:"Comment définit-on un incendie ?", o:[
    "Un feu violent qui échappe au contrôle de l'homme dans l'espace et dans le temps",
    "Toute flamme visible, même maîtrisée",
    "Une combustion lente sans flamme",
    "Une simple montée de température dans un local"], a:0,
    e:"Un incendie est un feu violent qui échappe au contrôle de l'homme dans l'espace et dans le temps. La priorité absolue reste le sauvetage et l'évacuation des personnes." },
  { t:"incendie", q:"Quels sont les trois éléments du triangle du feu ?", o:[
    "Combustible, comburant, énergie d'activation",
    "Chaleur, fumée, flamme",
    "Oxygène, eau, chaleur",
    "Combustible, fumée, étincelle"], a:0,
    e:"Le feu naît de la réunion du combustible, du comburant et d'une énergie d'activation. Supprimer un seul de ces éléments éteint le feu." },
  { t:"incendie", q:"Dans le triangle du feu, l'oxygène de l'air joue le rôle de :", o:[
    "Comburant","Combustible","Énergie d'activation","Inhibiteur"], a:0,
    e:"L'oxygène (environ 21 % de l'air) est le comburant. Attention au piège : si une proposition dit que l'oxygène est le combustible, elle est fausse." },
  { t:"incendie", q:"Le mode d'extinction par étouffement consiste à :", o:[
    "Empêcher l'apport d'oxygène (supprimer le comburant)",
    "Abaisser la température",
    "Empêcher l'apport de combustible",
    "Empêcher la réaction chimique"], a:0,
    e:"Étouffer = priver le feu d'oxygène. Refroidir supprime l'énergie d'activation, la coupure d'alimentation supprime le combustible, l'inhibition casse la réaction chimique." },
  { t:"incendie", q:"Le refroidissement comme mode d'extinction permet de supprimer :", o:[
    "L'énergie d'activation","Le comburant","Le combustible","La réaction en chaîne"], a:0,
    e:"Refroidir, c'est abaisser la température et donc supprimer l'énergie d'activation du triangle du feu." },
  { t:"incendie", q:"La propagation de la chaleur par les mouvements ascendants des fumées et gaz chauds s'appelle :", o:[
    "La convection","La conduction","Le rayonnement","La projection"], a:0,
    e:"Convection = transport de chaleur par les fumées et gaz chauds qui montent. La conduction passe par la masse d'un solide, le rayonnement par ondes électromagnétiques." },
  { t:"incendie", q:"À quelle classe de feu appartiennent le bois, le carton, le papier et le tissu ?", o:[
    "Classe A","Classe B","Classe C","Classe F"], a:0,
    e:"Classe A = feux secs de solides formant des braises. Classe B = liquides/gras, C = gaz, D = métaux, F = auxiliaires de cuisson." },
  { t:"incendie", q:"Les feux de gaz (butane, propane, hydrogène) relèvent de la classe :", o:[
    "Classe C","Classe A","Classe B","Classe D"], a:0,
    e:"Classe C = gaz. Le réflexe essentiel est de fermer la vanne : laisser la vanne ouverte crée un risque d'explosion." },
  { t:"incendie", q:"Sur un feu de métaux (classe D), que ne faut-il surtout pas utiliser ?", o:[
    "De l'eau","De la poudre D","Du sable sec","Du ciment sec"], a:0,
    e:"L'eau est interdite sur les feux de métaux (comme sur l'huile/graisse de cuisson et les batteries). On utilise poudre D, sable, ciment sec ou terre." },
  { t:"incendie", q:"Quelle est la première cause de mortalité lors d'un incendie ?", o:[
    "L'asphyxie (environ 80 %)","Les brûlures","L'effondrement","La panique"], a:0,

  UV06: { name:"Métiers & appréhension" },
};
// ordre d'affichage des UV (croissant)
const UV_ORDER = [...new Set(Object.values(THEMES).map(t=>t.uv))].sort();

let selected = new Set(Object.keys(THEMES)); // thèmes choisis
let expandedUV = new Set([UV_ORDER[0]]);     // groupes dépliés (le 1er ouvert par défaut)
let qCount = 10;
let shuffleOpts = true;
let session = null; // {questions, idx, answers:[], }

/* ---- Thème clair/sombre ---- */
const themeBtn = document.getElementById("themeBtn");
const themeLbl = document.getElementById("themeLbl");
function currentDark(){
  const attr = document.documentElement.getAttribute("data-theme");
  if(attr) return attr==="dark";
  return window.matchMedia("(prefers-color-scheme: dark)").matches;
}
function syncThemeLabel(){ themeLbl.textContent = currentDark() ? "Clair" : "Sombre"; }
themeBtn.addEventListener("click", ()=>{
  const dark = currentDark();
  document.documentElement.setAttribute("data-theme", dark ? "light" : "dark");
  syncThemeLabel();
});
syncThemeLabel();

/* ---- localStorage : meilleur score ---- */
function loadBest(){ try{ return JSON.parse(localStorage.getItem("qcu_tfp_best")||"{}"); }catch(e){ return {}; } }
function saveBest(o){ try{ localStorage.setItem("qcu_tfp_best", JSON.stringify(o)); }catch(e){} }

/* ---- utilitaires ---- */
function shuffle(a){ a=a.slice(); for(let i=a.length-1;i>0;i--){ const j=Math.floor(Math.random()*(i+1)); [a[i],a[j]]=[a[j],a[i]]; } return a; }
function countFor(keys){ return BANK.filter(q=>keys.has(q.t)).length; }
function esc(s){ return s.replace(/[&<>]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;"}[c])); }

/* ===================== ÉCRAN DE DÉPART ===================== */
function renderSetup(){
  progressRail.hidden = true;
  const best = loadBest();

  // Groupes dépliables par UV
  const groups = UV_ORDER.map(uv=>{
    const keys = Object.keys(THEMES).filter(k=>THEMES[k].uv===uv);
    const selCount = keys.filter(k=>selected.has(k)).length;
    const qTotal = BANK.filter(q=>THEMES[q.t].uv===uv).length;
    const open = expandedUV.has(uv);
    const allOn = selCount===keys.length;

    const tiles = keys.map(key=>{
      const th = THEMES[key];
      const on = selected.has(key);
      const n = BANK.filter(q=>q.t===key).length;
      return `<button class="theme-tile" data-theme-key="${key}" aria-pressed="${on}">
        <div class="tt-top">
          <span class="uv">${n} questions</span>
          <span class="check"><svg viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="3.2" stroke-linecap="round" stroke-linejoin="round"><path d="M5 13l4 4L19 7"/></svg></span>
        </div>
        <div class="tt-name">${th.name}</div>
      </button>`;
    }).join("");

    return `<div class="uv-group">
      <button class="uv-head" data-uv="${uv}" aria-expanded="${open}">
        <span class="uv-chevron"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"><path d="M9 6l6 6-6 6"/></svg></span>
        <span class="uv-head-txt">
          <span class="uv-code">${uv} · ${UV_META[uv]?UV_META[uv].name:""}</span>
          <span class="uv-sub">${keys.length} thème${keys.length>1?"s":""} · ${selCount} sélectionné${selCount>1?"s":""}</span>
        </span>
        <span class="uv-badge ${selCount>0?"on":""}">${selCount}/${keys.length}</span>
      </button>
      <div class="uv-body" ${open?"":"hidden"}>
        <div class="uv-tools"><button class="uv-selectall" data-uv-all="${uv}">${allOn?"Tout retirer":"Tout sélectionner"}</button></div>
        ${tiles}
      </div>
    </div>`;
  }).join("");

  const avail = countFor(selected);
  const counts = [10,20,"max"];
  const pills = counts.map(c=>{
    const val = c==="max"?avail:c;
    const label = c==="max"?"Tout":c;
    const on = (c==="max" && qCount>=avail) || qCount===c;
    const disabled = (typeof c==="number" && c>avail);
    return `<button class="pill" data-count="${c}" aria-pressed="${on}" ${disabled?"disabled style='opacity:.4'":""}>${label}</button>`;
  }).join("");

  app.innerHTML = `
    <section class="setup">
      <div class="intro">
        <span class="eyebrow">Révision · examen blanc</span>
        <h1>Entraînement QCU</h1>
        <p>Une seule bonne réponse par question. Choisissez vos thèmes, lancez une série et obtenez une correction détaillée à la fin. Questions tirées de vos fiches de révision CFPS.</p>
      </div>

      <div>
        <div class="section-label">1 · Thèmes à réviser</div>
        <div class="uv-list" id="uvList">${groups}</div>
      </div>

      <div>
        <div class="section-label">2 · Nombre de questions</div>
        <div class="pills" id="countPills">${pills}</div>
      </div>

      <div class="card" style="padding:4px 16px">
        <div class="toggle-row">
          <div>
            <div style="font-weight:600">Mélanger l'ordre des réponses</div>
            <div class="muted" style="font-size:.84rem">Évite de retenir la position de la bonne réponse</div>
          </div>
          <label class="switch"><input type="checkbox" id="shuffleOpt" ${shuffleOpts?"checked":""}><span class="slider"></span></label>
        </div>
      </div>

      <div>
        <button class="start-btn" id="startBtn">
          Commencer · <span class="tnum" id="startCount">${Math.min(qCount,avail)}</span> questions
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12h14M13 6l6 6-6 6"/></svg>
        </button>
        ${best.last!=null?`<div class="best" style="margin-top:12px"><svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 2l2.4 7.4H22l-6 4.6 2.3 7.4L12 17l-6.3 4.4L8 14 2 9.4h7.6z"/></svg> Meilleur score : <b class="tnum">&nbsp;${best.best}%</b></div>`:""}
      </div>

      <p class="footer-note">TFP APS — Agent de prévention et de sécurité · UV02 (environnement juridique) &amp; UV05 (incendie).<br>Support de révision, ne remplace pas les textes officiels ni le cours complet.</p>
    </section>`;

  // déplier / replier un UV
  app.querySelectorAll("[data-uv]").forEach(btn=>{
    btn.addEventListener("click", ()=>{
      const uv = btn.dataset.uv;
      if(expandedUV.has(uv)) expandedUV.delete(uv); else expandedUV.add(uv);
      renderSetup();
    });
  });
  // tout sélectionner / retirer dans un UV
  app.querySelectorAll("[data-uv-all]").forEach(btn=>{
    btn.addEventListener("click", (e)=>{
      e.stopPropagation();
      const uv = btn.dataset.uvAll;
      const keys = Object.keys(THEMES).filter(k=>THEMES[k].uv===uv);
      const allOn = keys.every(k=>selected.has(k));
      if(allOn){
        // ne pas tout vider globalement
        const remaining = [...selected].filter(k=>!keys.includes(k));
        if(remaining.length>=1) keys.forEach(k=>selected.delete(k));
      } else {
        keys.forEach(k=>selected.add(k));
      }
      expandedUV.add(uv);
      renderSetup();
    });
  });
  // interactions thèmes
  app.querySelectorAll("[data-theme-key]").forEach(btn=>{
    btn.addEventListener("click", ()=>{
      const k = btn.dataset.themeKey;
      if(selected.has(k)){ if(selected.size>1) selected.delete(k); }
      else selected.add(k);
      renderSetup();
    });
  });
  // interactions count
  app.querySelectorAll("[data-count]").forEach(btn=>{
    btn.addEventListener("click", ()=>{
      const c = btn.dataset.count;
      qCount = c==="max" ? countFor(selected) : Number(c);
      renderSetup();
    });
  });
  document.getElementById("shuffleOpt").addEventListener("change", e=>{ shuffleOpts = e.target.checked; });
  document.getElementById("startBtn").addEventListener("click", startQuiz);
}

/* ===================== LANCEMENT DU QUIZ ===================== */
function startQuiz(){
  const pool = BANK.filter(q=>selected.has(q.t));
  const n = Math.min(qCount, pool.length);
  const chosen = shuffle(pool).slice(0, n).map(q=>{
    let opts = q.o.map((text,i)=>({text, correct:i===q.a}));
    if(shuffleOpts) opts = shuffle(opts);
    return { ...q, opts };
  });
  session = { questions:chosen, idx:0, answers:[] };
  progressRail.hidden = false;
  renderQuestion();
}

/* ===================== UNE QUESTION ===================== */
function renderQuestion(){
  const s = session;
  const q = s.questions[s.idx];
  const th = THEMES[q.t];
  progressFill.style.width = ((s.idx)/s.questions.length*100)+"%";

  const opts = q.opts.map((o,i)=>{
    const L = String.fromCharCode(65+i);
    return `<button class="opt" data-opt="${i}">
      <span class="letter">${L}</span>
      <span class="otxt">${esc(o.text)}</span>
      <svg class="mark" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path class="m-ok" d="M5 13l4 4L19 7"/></svg>
    </button>`;
  }).join("");

  app.innerHTML = `
    <section class="quiz">
      <div class="q-meta">
        <span class="q-tag">
          <svg width="13" height="13" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><circle cx="12" cy="12" r="9" fill="none" stroke="currentColor" stroke-width="2"/><circle cx="12" cy="12" r="3.2"/></svg>
          ${th.uv} · ${th.short}
        </span>
        <span class="q-counter tnum">Question ${s.idx+1} / ${s.questions.length}</span>
      </div>

      <div class="card q-card">
        <p class="q-text">${esc(q.q)}</p>
        <p class="q-hint">Sélectionnez la bonne réponse.</p>
        <div class="options" id="options">${opts}</div>
        <div id="feedback"></div>
      </div>

      <button class="quit-link" id="quitBtn">Abandonner la série</button>
    </section>`;

  const optButtons = app.querySelectorAll(".opt");
  optButtons.forEach(btn=>{
    btn.addEventListener("click", ()=>answer(Number(btn.dataset.opt)));
  });
  document.getElementById("quitBtn").addEventListener("click", ()=>{
    if(session.answers.length===0){ renderSetup(); }
    else finish();
  });
}

function answer(chosenIdx){
  const s = session;
  const q = s.questions[s.idx];
  const optButtons = app.querySelectorAll(".opt");
  const correctIdx = q.opts.findIndex(o=>o.correct);
  const isCorrect = chosenIdx===correctIdx;

  optButtons.forEach((btn,i)=>{
    btn.disabled = true;
    if(i===correctIdx) btn.classList.add("correct");
    else if(i===chosenIdx) btn.classList.add("wrong");
    else btn.classList.add("dim");
  });

  s.answers.push({ q, chosenIdx, correctIdx, isCorrect });

  const fb = document.getElementById("feedback");
  const last = s.idx===s.questions.length-1;
  fb.innerHTML = `
    <div class="explain ${isCorrect?"ok":"ko"}">
      <div class="ex-head">
        ${isCorrect
          ? `<svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10" stroke-width="2"/><path d="M8 12l2.5 2.5L16 9"/></svg> Bonne réponse`
          : `<svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10" stroke-width="2"/><path d="M15 9l-6 6M9 9l6 6"/></svg> Réponse incorrecte`}
      </div>
      <div>${esc(q.e)}</div>
    </div>
    <button class="next-btn" id="nextBtn" style="margin-top:14px">
      ${last?"Voir mon résultat":"Question suivante"}
      <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12h14M13 6l6 6-6 6"/></svg>
    </button>`;

  progressFill.style.width = ((s.idx+1)/s.questions.length*100)+"%";
  const nb = document.getElementById("nextBtn");
  nb.addEventListener("click", ()=>{
    if(last){ finish(); }
    else { s.idx++; renderQuestion(); window.scrollTo({top:0, behavior:"smooth"}); }
  });
  nb.focus();
}

/* ===================== RÉSULTATS ===================== */
function finish(){
  progressRail.hidden = true;
  const s = session;
  const total = s.answers.length;
  const good = s.answers.filter(a=>a.isCorrect).length;
  const pct = total? Math.round(good/total*100) : 0;
  const pass = pct>=70;

  // meilleur score
  const best = loadBest();
  const newBest = Math.max(best.best||0, pct);
  saveBest({ best:newBest, last:pct });

  // ventilation par thème
  const byTheme = {};
  s.answers.forEach(a=>{
    const k=a.q.t;
    byTheme[k] = byTheme[k] || {good:0,total:0};
    byTheme[k].total++; if(a.isCorrect) byTheme[k].good++;
  });
  const bdRows = Object.entries(byTheme).map(([k,v])=>{
    const p = Math.round(v.good/v.total*100);
    return `<div class="bd-row">
      <span class="bd-name">${THEMES[k].short}</span>
      <span class="bd-bar"><i style="width:${p}%"></i></span>
      <span class="bd-score tnum">${v.good}/${v.total}</span>
    </div>`;
  }).join("");

  // anneau
  const R=66, C=2*Math.PI*R, off=C*(1-pct/100);

  const reviewCards = s.answers.map((a,i)=>{
    const correctText = a.q.opts[a.correctIdx].text;
    const chosenText = a.q.opts[a.chosenIdx].text;
    return `<div class="card rv-card">
      <p class="rv-q">
        <span class="ic">${a.isCorrect
          ? `<svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="var(--good)" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10" stroke-width="2"/><path d="M8 12l2.5 2.5L16 9"/></svg>`
          : `<svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="var(--bad)" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10" stroke-width="2"/><path d="M15 9l-6 6M9 9l6 6"/></svg>`}
        </span>
        <span>${i+1}. ${esc(a.q.q)}</span>
      </p>
      ${!a.isCorrect?`<div class="rv-line bad"><span class="lab">Votre choix</span><span class="val">${esc(chosenText)}</span></div>`:""}
      <div class="rv-line good"><span class="lab">Réponse</span><span class="val">${esc(correctText)}</span></div>
      <div class="rv-exp">${esc(a.q.e)}</div>
    </div>`;
  }).join("");

  app.innerHTML = `
    <section class="results">
      <div class="card score-card">
        <span class="eyebrow">Résultat de la série</span>
        <div class="ring">
          <svg width="150" height="150" viewBox="0 0 150 150">
            <circle cx="75" cy="75" r="${R}" fill="none" stroke="var(--line)" stroke-width="12"/>
            <circle cx="75" cy="75" r="${R}" fill="none" stroke="${pass?"var(--good)":"var(--flame)"}" stroke-width="12" stroke-linecap="round" stroke-dasharray="${C}" stroke-dashoffset="${off}"/>
          </svg>
          <div class="pct"><b class="tnum">${pct}%</b><span>${good}/${total} bonnes</span></div>
        </div>
        <div class="verdict ${pass?"pass":"fail"}">${pass?"Objectif atteint":"À retravailler"}</div>
        <div class="score-sub">${pass?"Vous dépassez le seuil des 70 %. Continuez à varier les thèmes.":"Visez au moins 70 %. Revoyez la correction ci-dessous."}</div>
      </div>

      <div class="card breakdown">
        <div class="section-label" style="margin-bottom:4px">Par thème</div>
        ${bdRows}
      </div>

      <div class="actions">
        <button class="start-btn" id="againBtn">
          Nouvelle série
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M3 12a9 9 0 1 0 3-6.7L3 8"/><path d="M3 3v5h5"/></svg>
        </button>
        <button class="next-btn" id="homeBtn" style="background:var(--surface-2);color:var(--ink);border:1px solid var(--line)">Changer de thèmes</button>
      </div>

      <h2 class="rv-title">Correction détaillée</h2>
      <div class="review">${reviewCards}</div>

      <button class="next-btn" id="homeBtn2" style="background:var(--surface-2);color:var(--ink);border:1px solid var(--line);margin-top:4px">Retour à l'accueil</button>
    </section>`;

  document.getElementById("againBtn").addEventListener("click", ()=>{ startQuiz(); window.scrollTo({top:0}); });
  const home = ()=>{ renderSetup(); window.scrollTo({top:0}); };
  document.getElementById("homeBtn").addEventListener("click", home);
  document.getElementById("homeBtn2").addEventListener("click", home);
  window.scrollTo({top:0, behavior:"smooth"});
}

/* ===================== GO ===================== */
renderSetup();
</script>
